<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgRev)"/>

  <!-- Title -->
  <text x="400" y="38" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🔄 "Reverse Acrobatics: Flipping Arrays &amp; Characters Around!"</text>

  <!-- Left: Original Array -->
  <g transform="translate(60, 75)">
    <rect width="280" height="130" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="140" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">Original Array (0 ➔ N-1)</text>

    <!-- Cells [1, 2, 4, 6, 7] -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="45" height="40" rx="6" fill="#1e1e2e"/>
      <text x="22" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">1</text>
      <text x="22" y="55" font-family="sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">idx 0</text>

      <rect x="52" y="0" width="45" height="40" rx="6" fill="#1e1e2e"/>
      <text x="74" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">2</text>
      <text x="74" y="55" font-family="sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">idx 1</text>

      <rect x="104" y="0" width="45" height="40" rx="6" fill="#1e1e2e"/>
      <text x="126" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">4</text>
      <text x="126" y="55" font-family="sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">idx 2</text>

      <rect x="156" y="0" width="45" height="40" rx="6" fill="#1e1e2e"/>
      <text x="178" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">6</text>
      <text x="178" y="55" font-family="sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">idx 3</text>

      <rect x="208" y="0" width="45" height="40" rx="6" fill="#1e1e2e"/>
      <text x="230" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">7</text>
      <text x="230" y="55" font-family="sans-serif" font-size="10" fill="#6c7086" text-anchor="middle">idx 4</text>
    </g>
  </g>

  <!-- Animated Reverse Arrow in Center -->
  <g transform="translate(355, 110)">
    <style>
      @keyframes flipCartwheel {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(180deg); }
      }
      .animFlip { animation: flipCartwheel 2s ease-in-out infinite; transform-origin: 45px 25px; }
    </style>
    <g class="animFlip">
      <path d="M 15,25 Q 45,5 75,25" fill="none" stroke="#f9e2af" stroke-width="4" stroke-linecap="round"/>
      <polygon points="75,20 85,25 78,35" fill="#f9e2af"/>
      <path d="M 75,35 Q 45,55 15,35" fill="none" stroke="#a6e3a1" stroke-width="4" stroke-linecap="round"/>
      <polygon points="15,40 5,35 12,25" fill="#a6e3a1"/>
    </g>
    <text x="45" y="70" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#fab387" text-anchor="middle">Loop (N-1 ➔ 0)</text>
  </g>

  <!-- Right: Reversed Array -->
  <g transform="translate(460, 75)">
    <rect width="280" height="130" rx="10" fill="#11111b" stroke="#a6e3a1" stroke-width="2"/>
    <text x="140" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">Reversed Result (j = 4 ➔ 0)</text>

    <!-- Cells [7, 6, 4, 2, 1] -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="45" height="40" rx="6" fill="#313244"/>
      <text x="22" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#a6e3a1" text-anchor="middle">7</text>

      <rect x="52" y="0" width="45" height="40" rx="6" fill="#313244"/>
      <text x="74" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#a6e3a1" text-anchor="middle">6</text>

      <rect x="104" y="0" width="45" height="40" rx="6" fill="#313244"/>
      <text x="126" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#a6e3a1" text-anchor="middle">4</text>

      <rect x="156" y="0" width="45" height="40" rx="6" fill="#313244"/>
      <text x="178" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#a6e3a1" text-anchor="middle">2</text>

      <rect x="208" y="0" width="45" height="40" rx="6" fill="#313244"/>
      <text x="230" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="#a6e3a1" text-anchor="middle">1</text>
    </g>
  </g>

  <!-- Footer Pro-Tip -->
  <text x="400" y="260" font-family="sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">Tip: Built-in `.split('').reverse().join('')` vs. Iterative `for (let j = n-1; j &gt;= 0; j--)`</text>
  <text x="400" y="295" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Linear O(n) Time Complexity | Can be swapped in-place for O(1) space!</text>
</svg>

