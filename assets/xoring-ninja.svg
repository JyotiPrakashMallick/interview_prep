<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e31" />
      <stop offset="100%" stop-color="#24304f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .mono { font-family: 'Courier New', monospace; font-size: 13px; fill: #facc15; font-weight: bold; }
    .cell { font-family: 'Courier New', monospace; font-size: 13px; fill: #e2e8f0; }
    .hit { fill: #34d399; font-weight: bold; }
  </style>

  <rect width="920" height="420" rx="16" fill="url(#bgGrad)" />

  <g transform="translate(40, 42)">
    <text x="0" y="5" class="title">Xoring Ninja: Per-Bit Contribution</text>
    <text x="0" y="25" class="subtitle">Any bit present in some element is set in exactly half of all subset XORs &#x2192; XorSum = OR(arr) &#xD7; 2&#x207F;&#x207B;&#xB9;</text>
  </g>

  <!-- Left: subset table for {3, 4} -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="435" height="295" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. ALL SUBSETS OF {3, 4} (n = 2)</text>
    <text x="24" y="52" class="subtitle">3 = 011&#x2082;, 4 = 100&#x2082; &#x2022; columns are bits 2, 1, 0</text>

    <g transform="translate(24, 80)">
      <text x="0" y="0" class="label">Subset</text>
      <text x="140" y="0" class="label">XOR</text>
      <text x="220" y="0" class="label">Bits (2 1 0)</text>
      <line x1="0" y1="10" x2="387" y2="10" stroke="#334155" />

      <text x="0" y="34" class="cell">{ }</text>
      <text x="140" y="34" class="cell">0</text>
      <text x="220" y="34" class="cell">0 0 0</text>

      <text x="0" y="60" class="cell">{3}</text>
      <text x="140" y="60" class="cell">3</text>
      <text x="220" y="60" class="cell">0 <tspan class="hit">1 1</tspan></text>

      <text x="0" y="86" class="cell">{4}</text>
      <text x="140" y="86" class="cell">4</text>
      <text x="220" y="86" class="cell"><tspan class="hit">1</tspan> 0 0</text>

      <text x="0" y="112" class="cell">{3, 4}</text>
      <text x="140" y="112" class="cell">7</text>
      <text x="220" y="112" class="cell"><tspan class="hit">1 1 1</tspan></text>

      <line x1="0" y1="124" x2="387" y2="124" stroke="#334155" />
      <text x="0" y="146" class="label">Times each bit is set:</text>
      <text x="220" y="146" class="mono">2 2 2</text>
    </g>

    <g transform="translate(24, 240)">
      <rect width="387" height="38" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="24" class="label" fill="#34d399">Each bit set in 2 = 2&#x207F;&#x207B;&#xB9; of the 4 subsets</text>
    </g>
  </g>

  <!-- Right: formula -->
  <g transform="translate(495, 90)" filter="url(#shadow)">
    <rect width="385" height="295" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. COLLAPSE TO ONE FORMULA</text>
    <text x="24" y="52" class="subtitle">Pairing argument: toggle one element that has bit b</text>

    <g transform="translate(24, 72)">
      <rect width="337" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" />
      <text x="14" y="22" class="label" fill="#38bdf8">Bits that appear anywhere:</text>
      <text x="14" y="44" class="mono">OR = 3 | 4 = 111&#x2082; = 7</text>
    </g>

    <g transform="translate(24, 142)">
      <rect width="337" height="60" rx="8" fill="#0f172a" stroke="#a855f7" />
      <text x="14" y="22" class="label" fill="#c084fc">Each such bit counted:</text>
      <text x="14" y="44" class="mono">2&#x207F;&#x207B;&#xB9; = 2&#xB9; = 2 times</text>
    </g>

    <g transform="translate(24, 212)">
      <rect width="337" height="66" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="14" y="24" class="label" fill="#34d399">XorSum = OR &#xD7; 2&#x207F;&#x207B;&#xB9; mod (10&#x2079; + 7)</text>
      <text x="14" y="46" class="mono">7 &#xD7; 2 = 14 &#x2714;</text>
    </g>
  </g>
</svg>
