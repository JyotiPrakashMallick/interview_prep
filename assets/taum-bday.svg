<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTaum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowGift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f9e2af" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="840" height="380" rx="16" fill="url(#bgTaum)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🎁 "Taum and B'day: The Gift Color Conversion Arbitrage!"</text>

  <!-- Left: Black Gift Decision Card -->
  <g transform="translate(60, 65)">
    <rect width="320" height="175" rx="12" fill="#181825" stroke="#cba6f7" stroke-width="2"/>
    <text x="160" y="26" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#cba6f7" text-anchor="middle">🖤 Black Gifts: b needed</text>

    <!-- Black Gift Graphic -->
    <rect x="25" y="45" width="55" height="55" rx="8" fill="#11111b" stroke="#6c7086" stroke-width="2"/>
    <!-- Ribbon -->
    <line x1="52.5" y1="45" x2="52.5" y2="100" stroke="#f38ba8" stroke-width="3"/>
    <line x1="25" y1="72.5" x2="80" y2="72.5" stroke="#f38ba8" stroke-width="3"/>
    <text x="52.5" y="125" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Black Gift</text>

    <!-- Two options -->
    <g transform="translate(95, 45)">
      <rect x="0" y="0" width="205" height="32" rx="5" fill="#313244"/>
      <text x="10" y="20" font-family="monospace" font-size="11" fill="#cdd6f4">Option 1: Buy Direct = bc</text>

      <rect x="0" y="38" width="205" height="32" rx="5" fill="#313244"/>
      <text x="10" y="58" font-family="monospace" font-size="11" fill="#fab387">Option 2: White + z = wc + z</text>
    </g>

    <!-- Formula -->
    <rect x="20" y="135" width="280" height="28" rx="6" fill="#11111b" stroke="#a6e3a1"/>
    <text x="160" y="153" font-family="monospace" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">cost = min(bc, wc + z)</text>
  </g>

  <!-- Animated Converter Wand in Center -->
  <g transform="translate(400, 105)">
    <style>
      @keyframes wandSpin {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(10deg); }
      }
      .animWand { animation: wandSpin 1.4s ease-in-out infinite; transform-origin: 20px 45px; }
    </style>
    <g class="animWand">
      <!-- Wand -->
      <line x1="5" y1="65" x2="35" y2="15" stroke="#fab387" stroke-width="4" stroke-linecap="round"/>
      <!-- Star on wand -->
      <polygon points="35,5 39,15 49,15 41,22 44,32 35,26 26,32 29,22 21,15 31,15" fill="#f9e2af" filter="url(#glowGift)"/>
    </g>
    <text x="20" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#f9e2af" text-anchor="middle">Convert</text>
    <text x="20" y="102" font-family="monospace" font-size="13" font-weight="bold" fill="#fab387" text-anchor="middle">+z cost</text>
  </g>

  <!-- Right: White Gift Decision Card -->
  <g transform="translate(460, 65)">
    <rect width="320" height="175" rx="12" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
    <text x="160" y="26" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">🤍 White Gifts: w needed</text>

    <!-- White Gift Graphic -->
    <rect x="25" y="45" width="55" height="55" rx="8" fill="#cdd6f4" stroke="#bac2de" stroke-width="2"/>
    <line x1="52.5" y1="45" x2="52.5" y2="100" stroke="#89b4fa" stroke-width="3"/>
    <line x1="25" y1="72.5" x2="80" y2="72.5" stroke="#89b4fa" stroke-width="3"/>
    <text x="52.5" y="125" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">White Gift</text>

    <!-- Two options -->
    <g transform="translate(95, 45)">
      <rect x="0" y="0" width="205" height="32" rx="5" fill="#313244"/>
      <text x="10" y="20" font-family="monospace" font-size="11" fill="#cdd6f4">Option 1: Buy Direct = wc</text>

      <rect x="0" y="38" width="205" height="32" rx="5" fill="#313244"/>
      <text x="10" y="58" font-family="monospace" font-size="11" fill="#fab387">Option 2: Black + z = bc + z</text>
    </g>

    <!-- Formula -->
    <rect x="20" y="135" width="280" height="28" rx="6" fill="#11111b" stroke="#a6e3a1"/>
    <text x="160" y="153" font-family="monospace" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">cost = min(wc, bc + z)</text>
  </g>

  <!-- Bottom Total Formula & BigInt Footnote -->
  <g transform="translate(60, 260)">
    <rect width="720" height="95" rx="10" fill="#181825" stroke="#45475a"/>
    <text x="360" y="24" font-family="monospace" font-size="13" font-weight="bold" fill="#f9e2af" text-anchor="middle">Total Minimal Cost = (b × min(bc, wc + z)) + (w × min(wc, bc + z))</text>
    <text x="360" y="50" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" fill="#f38ba8" text-anchor="middle">⚠️ Beware 64-bit Overflow! Inputs up to 10⁹ ➔ Total up to 2 × 10¹⁸ (Exceeds Number.MAX_SAFE_INTEGER!)</text>
    <text x="360" y="74" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Always use BigInt! Complexity: O(1) Time | O(1) Space</text>
  </g>
</svg>
