<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowBT" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes t1 { 0%, 5% { opacity: 0; } 10%, 30% { opacity: 1; } 35%, 100% { opacity: 0; } }
    @keyframes t2 { 0%, 35% { opacity: 0; } 40%, 60% { opacity: 1; } 65%, 100% { opacity: 0; } }
    @keyframes t3 { 0%, 65% { opacity: 0; } 70%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes tally1 { 0%, 10% { opacity: 0; } 15%, 100% { opacity: 1; } }
    @keyframes tally2 { 0%, 40% { opacity: 0; } 45%, 100% { opacity: 1; } }
    @keyframes tally3 { 0%, 70% { opacity: 0; } 75%, 100% { opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .trip1 { animation: t1 6s ease-in-out infinite; }
    .trip2 { animation: t2 6s ease-in-out infinite; }
    .trip3 { animation: t3 6s ease-in-out infinite; }
    .tal1 { animation: tally1 6s linear infinite; }
    .tal2 { animation: tally2 6s linear infinite; }
    .tal3 { animation: tally3 6s linear infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgBT)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">💎 "Beautiful Triplets: Hop d, Hop d Again!"</text>

  <!-- Mascot -->
  <g class="mascot" transform="translate(40, 60)">
    <circle cx="35" cy="35" r="30" fill="#cba6f7"/>
    <circle cx="25" cy="30" r="4" fill="#11111b"/>
    <circle cx="45" cy="30" r="4" fill="#11111b"/>
    <path d="M 22 44 Q 35 54 48 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">"d = 1"</text>
  </g>

  <!-- Array: [2, 2, 3, 4, 5] -->
  <text x="470" y="74" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#89b4fa" text-anchor="middle">arr = [2, 2, 3, 4, 5]   (sorted)</text>
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <rect x="235" y="90" width="80" height="60" rx="10" fill="#313244"/>
    <text x="275" y="130" font-size="26" fill="#cdd6f4">2</text>
    <text x="275" y="168" font-size="12" fill="#6c7086">i=0</text>

    <rect x="335" y="90" width="80" height="60" rx="10" fill="#313244"/>
    <text x="375" y="130" font-size="26" fill="#cdd6f4">2</text>
    <text x="375" y="168" font-size="12" fill="#6c7086">i=1</text>

    <rect x="435" y="90" width="80" height="60" rx="10" fill="#313244"/>
    <text x="475" y="130" font-size="26" fill="#cdd6f4">3</text>
    <text x="475" y="168" font-size="12" fill="#6c7086">i=2</text>

    <rect x="535" y="90" width="80" height="60" rx="10" fill="#313244"/>
    <text x="575" y="130" font-size="26" fill="#cdd6f4">4</text>
    <text x="575" y="168" font-size="12" fill="#6c7086">i=3</text>

    <rect x="635" y="90" width="80" height="60" rx="10" fill="#313244"/>
    <text x="675" y="130" font-size="26" fill="#cdd6f4">5</text>
    <text x="675" y="168" font-size="12" fill="#6c7086">i=4</text>
  </g>

  <!-- Triplet 1: [0,2,3] -->
  <g class="trip1">
    <rect x="235" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <rect x="435" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <rect x="535" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <path d="M 275 88 Q 375 50 475 88" stroke="#fab387" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <path d="M 475 88 Q 525 64 575 88" stroke="#fab387" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <text x="470" y="210" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4" text-anchor="middle">[0, 2, 3] ➔ 2 → 3 → 4   (+1, +1)</text>
  </g>

  <!-- Triplet 2: [1,2,3] -->
  <g class="trip2">
    <rect x="335" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <rect x="435" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <rect x="535" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <path d="M 375 88 Q 425 64 475 88" stroke="#fab387" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <path d="M 475 88 Q 525 64 575 88" stroke="#fab387" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <text x="470" y="210" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4" text-anchor="middle">[1, 2, 3] ➔ 2 → 3 → 4   (+1, +1)</text>
  </g>

  <!-- Triplet 3: [2,3,4] -->
  <g class="trip3">
    <rect x="435" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <rect x="535" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <rect x="635" y="90" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowBT)"/>
    <path d="M 475 88 Q 525 64 575 88" stroke="#fab387" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <path d="M 575 88 Q 625 64 675 88" stroke="#fab387" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <text x="470" y="210" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4" text-anchor="middle">[2, 3, 4] ➔ 3 → 4 → 5   (+1, +1)</text>
  </g>

  <!-- Frequency formula panel -->
  <g transform="translate(140, 235)">
    <rect x="0" y="0" width="660" height="110" rx="12" fill="#181825" stroke="#cba6f7" stroke-width="2"/>
    <text x="330" y="26" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#cba6f7" text-anchor="middle">Count with a frequency map: c(x) × c(x+d) × c(x+2d)</text>
    <g font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">
      <text x="170" y="58" fill="#f9e2af">x = 2: 2 × 1 × 1 = 2</text>
      <text x="490" y="58" fill="#f9e2af">x = 3: 1 × 1 × 1 = 1</text>
    </g>
    <g font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1" text-anchor="middle">
      <text x="270" y="92">Total:</text>
      <text class="tal1" x="320" y="92">✔</text>
      <text class="tal2" x="345" y="92">✔</text>
      <text class="tal3" x="370" y="92">✔</text>
      <text class="tal3" x="420" y="92" filter="url(#glowBT)">= 3 💎</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Triplet = (x, x+d, x+2d) │ Sorted ➔ i &lt; j &lt; k for free │ O(n) Time, O(n) Space</text>
</svg>
