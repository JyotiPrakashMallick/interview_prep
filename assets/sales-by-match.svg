<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSocks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="sockShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgSocks)"/>

  <!-- Title / Speech Bubble -->
  <g transform="translate(240, 20)">
    <rect width="320" height="40" rx="10" fill="#f9e2af" filter="url(#sockShadow)"/>
    <text x="160" y="25" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#11111b" text-anchor="middle">🧦 "Odd one out stays forever alone!"</text>
  </g>

  <!-- Left: Sock Chaos Pile -->
  <g transform="translate(60, 90)">
    <rect width="260" height="180" rx="12" fill="#313244" stroke="#45475a" stroke-width="2"/>
    <text x="130" y="30" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4" text-anchor="middle">📦 Laundry Basket (Input Array)</text>
    <text x="130" y="52" font-family="monospace" font-size="12" fill="#a6adc8" text-anchor="middle">[Red, Blue, Red, Red, Blue, Blue, Blue]</text>

    <!-- Animated Jumbled Socks -->
    <style>
      @keyframes floatSock1 { 0%, 100% { transform: translateY(0) rotate(-15deg); } 50% { transform: translateY(-8px) rotate(-5deg); } }
      @keyframes floatSock2 { 0%, 100% { transform: translateY(0) rotate(20deg); } 50% { transform: translateY(-6px) rotate(10deg); } }
      .animSock1 { animation: floatSock1 2s ease-in-out infinite; }
      .animSock2 { animation: floatSock2 2.5s ease-in-out infinite; }
    </style>

    <!-- Red sock 1 -->
    <g class="animSock1" transform="translate(40, 80)">
      <path d="M 0,0 L 20,0 L 20,30 L 35,45 L 25,55 L 0,35 Z" fill="#f38ba8"/>
      <circle cx="8" cy="12" r="3" fill="#fff"/>
      <circle cx="16" cy="12" r="3" fill="#fff"/>
    </g>
    <!-- Red sock 2 -->
    <g class="animSock2" transform="translate(90, 90)">
      <path d="M 0,0 L 20,0 L 20,30 L 35,45 L 25,55 L 0,35 Z" fill="#f38ba8"/>
    </g>
    <!-- Red sock 3 -->
    <g class="animSock1" transform="translate(140, 75)">
      <path d="M 0,0 L 20,0 L 20,30 L 35,45 L 25,55 L 0,35 Z" fill="#f38ba8"/>
    </g>
    <!-- Blue sock 1,2,3,4 -->
    <g class="animSock2" transform="translate(60, 110)">
      <path d="M 0,0 L 20,0 L 20,30 L 35,45 L 25,55 L 0,35 Z" fill="#89b4fa"/>
    </g>
    <g class="animSock1" transform="translate(180, 95)">
      <path d="M 0,0 L 20,0 L 20,30 L 35,45 L 25,55 L 0,35 Z" fill="#89b4fa"/>
    </g>
    <g class="animSock2" transform="translate(115, 115)">
      <path d="M 0,0 L 20,0 L 20,30 L 35,45 L 25,55 L 0,35 Z" fill="#89b4fa"/>
    </g>
    <g class="animSock1" transform="translate(160, 120)">
      <path d="M 0,0 L 20,0 L 20,30 L 35,45 L 25,55 L 0,35 Z" fill="#89b4fa"/>
    </g>
  </g>

  <!-- Process Arrow -->
  <g transform="translate(335, 150)">
    <line x1="0" y1="20" x2="45" y2="20" stroke="#f9e2af" stroke-width="4" stroke-linecap="round"/>
    <polygon points="45,10 65,20 45,30" fill="#f9e2af"/>
    <text x="30" y="48" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" font-weight="bold" fill="#f9e2af" text-anchor="middle">count / 2</text>
  </g>

  <!-- Right: Sorted Pairs -->
  <g transform="translate(415, 90)">
    <rect width="330" height="180" rx="12" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2"/>
    <text x="165" y="30" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1" text-anchor="middle">✨ Paired &amp; Ready to Wear!</text>

    <!-- Red pair (1 pair) + 1 leftover -->
    <g transform="translate(25, 45)">
      <!-- Pair 1 -->
      <g transform="translate(0, 5)">
        <path d="M 0,0 L 15,0 L 15,22 L 26,33 L 18,40 L 0,25 Z" fill="#f38ba8"/>
        <path d="M 12,0 L 27,0 L 27,22 L 38,33 L 30,40 L 12,25 Z" fill="#f38ba8"/>
        <text x="20" y="55" font-family="sans-serif" font-size="11" fill="#f38ba8" font-weight="bold">Pair 1 ❤️</text>
      </g>

      <!-- Leftover crying sock -->
      <g transform="translate(70, 5)">
        <path d="M 0,0 L 15,0 L 15,22 L 26,33 L 18,40 L 0,25 Z" fill="#f38ba8" opacity="0.6"/>
        <!-- Sad tear -->
        <circle cx="20" cy="15" r="2.5" fill="#89dceb"/>
        <text x="15" y="55" font-family="sans-serif" font-size="10" fill="#a6adc8">Leftover 😢</text>
      </g>
      <text x="175" y="25" font-family="monospace" font-size="13" fill="#cdd6f4">3 Red ➔ 3 // 2 = 1 Pair</text>
    </g>

    <!-- Blue pairs (2 pairs) -->
    <g transform="translate(25, 115)">
      <!-- Pair 1 -->
      <path d="M 0,0 L 15,0 L 15,22 L 26,33 L 18,40 L 0,25 Z" fill="#89b4fa"/>
      <path d="M 12,0 L 27,0 L 27,22 L 38,33 L 30,40 L 12,25 Z" fill="#89b4fa"/>
      <!-- Pair 2 -->
      <path d="M 50,0 L 65,0 L 65,22 L 76,33 L 68,40 L 50,25 Z" fill="#89b4fa"/>
      <path d="M 62,0 L 77,0 L 77,22 L 88,33 L 80,40 L 62,25 Z" fill="#89b4fa"/>
      <text x="45" y="55" font-family="sans-serif" font-size="11" fill="#89b4fa" font-weight="bold">2 Blue Pairs 💙💙</text>
      <text x="175" y="25" font-family="monospace" font-size="13" fill="#cdd6f4">4 Blue ➔ 4 // 2 = 2 Pairs</text>
    </g>
  </g>

  <!-- Bottom Result Banner -->
  <text x="400" y="300" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1" text-anchor="middle">🎉 Total Pairs = 1 + 2 = 3 Pairs | Time Complexity: O(n)</text>
</svg>

