<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSubset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowGoldSubset" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f9e2af" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="840" height="380" rx="16" fill="url(#bgSubset)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">⚔️ "Non-Divisible Subset: Remainder Duel &amp; Greedy Survival!"</text>

  <!-- Left: Remainder Buckets Clash -->
  <g transform="translate(45, 65)">
    <rect width="350" height="185" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="175" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">🥊 Remainder Pairs Duel: r vs (k - r)</text>
    <text x="175" y="48" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">If you take both, (r + k - r) % k == 0 (BOOM! 💥)</text>

    <!-- Boxing ring / Duel between r=1 and r=2 for k=3 -->
    <!-- Bucket r=1 (Winner, 3 elements) -->
    <g transform="translate(20, 65)">
      <rect width="135" height="100" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
      <text x="67" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">rem = 1 (Count: 3)</text>
      <!-- Elements [1, 7, 4] -->
      <circle cx="35" cy="50" r="16" fill="#a6e3a1"/>
      <text x="35" y="55" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">1</text>
      <circle cx="70" cy="50" r="16" fill="#a6e3a1"/>
      <text x="70" y="55" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">7</text>
      <circle cx="105" cy="50" r="16" fill="#a6e3a1"/>
      <text x="105" y="55" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">4</text>
      <!-- Crown -->
      <text x="67" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" font-weight="bold" fill="#f9e2af" text-anchor="middle">👑 PICKED (Max!)</text>
    </g>

    <!-- VS Text in center -->
    <text x="175" y="125" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f38ba8" text-anchor="middle">VS</text>

    <!-- Bucket r=2 (Loser, 1 element) -->
    <g transform="translate(195, 65)">
      <rect width="135" height="100" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="67" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#f38ba8" text-anchor="middle">rem = 2 (Count: 1)</text>
      <!-- Element [2] -->
      <circle cx="67" cy="50" r="16" fill="#f38ba8" opacity="0.6"/>
      <text x="67" y="55" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">2</text>
      <!-- Dropped -->
      <text x="67" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#eba0ac" text-anchor="middle">❌ DROPPED</text>
    </g>
  </g>

  <!-- Right: 2 Critical Special Case Bouncers -->
  <g transform="translate(425, 65)">
    <rect width="370" height="185" rx="12" fill="#11111b" stroke="#fab387" stroke-width="2"/>
    <text x="185" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#fab387" text-anchor="middle">⚠️ The Two Dangerous Special Cases</text>

    <!-- Special Case 1: rem = 0 -->
    <g transform="translate(15, 45)">
      <rect width="340" height="55" rx="6" fill="#313244"/>
      <text x="15" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#f9e2af">1. Remainder 0: (0 + 0) % k === 0</text>
      <text x="15" y="42" font-family="sans-serif" font-size="11" fill="#cdd6f4">Two numbers of rem 0 sum to multiple of k ➔</text>
      <rect x="235" y="12" width="95" height="30" rx="4" fill="#a6e3a1"/>
      <text x="282" y="32" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">Max 1 Pick! 🛡️</text>
    </g>

    <!-- Special Case 2: Even k where rem = k / 2 -->
    <g transform="translate(15, 115)">
      <rect width="340" height="55" rx="6" fill="#313244"/>
      <text x="15" y="22" font-family="monospace" font-size="12" font-weight="bold" fill="#f9e2af">2. Even k Midpoint: (k/2 + k/2) % k === 0</text>
      <text x="15" y="42" font-family="sans-serif" font-size="11" fill="#cdd6f4">e.g. k=4: (2 + 2) = 4 divisible! ➔</text>
      <rect x="235" y="12" width="95" height="30" rx="4" fill="#a6e3a1"/>
      <text x="282" y="32" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">Max 1 Pick! 🛡️</text>
    </g>
  </g>

  <!-- Bottom Strategy Banner -->
  <g transform="translate(45, 265)">
    <rect width="750" height="95" rx="10" fill="#181825" stroke="#45475a"/>
    <text x="375" y="25" font-family="monospace" font-size="13" font-weight="bold" fill="#f9e2af" text-anchor="middle">Greedy Formula: maxSubset = min(count[0], 1) + sum( max(count[r], count[k-r]) )</text>
    <text x="375" y="50" font-family="sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">If k is even and r === k/2: add min(count[k/2], 1) instead of pairing.</text>
    <text x="375" y="75" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Single Pass O(n + k) Time | O(k) Space — Handles up to n = 100,000 instantly!</text>
  </g>
</svg>
