<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowFS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    /* three phases: left edge, gap between stations, right edge */
    @keyframes phA { 0%, 3% { opacity: 0; } 6%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes phB { 0%, 36% { opacity: 0; } 39%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes phC { 0%, 69% { opacity: 0; } 72%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .a { animation: phA 9s ease-in-out infinite; }
    .b { animation: phB 9s ease-in-out infinite; }
    .c { animation: phC 9s ease-in-out infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
    .beacon { animation: blink 1.4s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgFS)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🚀 "Flatland: How Far to the Nearest Space Station?"</text>

  <!-- Mascot -->
  <g class="mascot" transform="translate(30, 60)">
    <circle cx="35" cy="35" r="30" fill="#cba6f7"/>
    <circle cx="25" cy="30" r="4" fill="#11111b"/>
    <circle cx="45" cy="30" r="4" fill="#11111b"/>
    <path d="M 22 44 Q 35 54 48 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">"Worst city?"</text>
  </g>

  <text x="485" y="70" font-family="monospace" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">n = 10, c = [1, 8] (sorted)</text>

  <!-- Road: cities 0..9 at x = 170 + 70 * i, y = 200 -->
  <line x1="170" y1="200" x2="800" y2="200" stroke="#45475a" stroke-width="4"/>
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <circle cx="170" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="170" y="236" font-size="12" fill="#6c7086">0</text>
    <circle cx="240" cy="200" r="16" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="2"/><text x="240" y="236" font-size="12" fill="#a6e3a1">1</text>
    <circle cx="310" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="310" y="236" font-size="12" fill="#6c7086">2</text>
    <circle cx="380" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="380" y="236" font-size="12" fill="#6c7086">3</text>
    <circle cx="450" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="450" y="236" font-size="12" fill="#6c7086">4</text>
    <circle cx="520" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="520" y="236" font-size="12" fill="#6c7086">5</text>
    <circle cx="590" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="590" y="236" font-size="12" fill="#6c7086">6</text>
    <circle cx="660" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="660" y="236" font-size="12" fill="#6c7086">7</text>
    <circle cx="730" cy="200" r="16" fill="#a6e3a1" stroke="#a6e3a1" stroke-width="2"/><text x="730" y="236" font-size="12" fill="#a6e3a1">8</text>
    <circle cx="800" cy="200" r="14" fill="#313244" stroke="#585b70" stroke-width="2"/><text x="800" y="236" font-size="12" fill="#6c7086">9</text>
  </g>
  <!-- Stations -->
  <text class="beacon" x="240" y="170" font-size="24" text-anchor="middle">🚀</text>
  <text class="beacon" x="730" y="170" font-size="24" text-anchor="middle">🚀</text>

  <!-- Phase A: left edge -> city 0 is c[0] = 1 away -->
  <g class="a">
    <circle cx="170" cy="200" r="20" fill="none" stroke="#fab387" stroke-width="3"/>
    <path d="M 170 260 L 240 260" stroke="#fab387" stroke-width="3" marker-end="none"/>
    <line x1="170" y1="252" x2="170" y2="268" stroke="#fab387" stroke-width="3"/>
    <line x1="240" y1="252" x2="240" y2="268" stroke="#fab387" stroke-width="3"/>
    <text x="205" y="284" font-family="monospace" font-size="13" font-weight="bold" fill="#fab387" text-anchor="middle">1</text>
    <text x="485" y="330" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#fab387" text-anchor="middle">Left edge: city 0 is c[0] = 1 km away</text>
  </g>

  <!-- Phase B: gap between 1 and 8 -> middle cities 4 and 5 are 3 away -->
  <g class="b">
    <rect x="225" y="140" width="520" height="120" rx="12" fill="none" stroke="#89b4fa" stroke-width="2" stroke-dasharray="8 5"/>
    <circle cx="450" cy="200" r="20" fill="none" stroke="#f38ba8" stroke-width="3"/>
    <circle cx="520" cy="200" r="20" fill="none" stroke="#f38ba8" stroke-width="3"/>
    <line x1="240" y1="275" x2="450" y2="275" stroke="#f38ba8" stroke-width="3"/>
    <text x="345" y="295" font-family="monospace" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">3</text>
    <line x1="520" y1="275" x2="730" y2="275" stroke="#f38ba8" stroke-width="3"/>
    <text x="625" y="295" font-family="monospace" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">3</text>
    <text x="485" y="330" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowFS)">Gap: floor((8 - 1) / 2) = 3 ➔ the middle is the worst!</text>
  </g>

  <!-- Phase C: right edge -> city 9 is (n-1) - 8 = 1 away -->
  <g class="c">
    <circle cx="800" cy="200" r="20" fill="none" stroke="#fab387" stroke-width="3"/>
    <line x1="730" y1="260" x2="800" y2="260" stroke="#fab387" stroke-width="3"/>
    <line x1="730" y1="252" x2="730" y2="268" stroke="#fab387" stroke-width="3"/>
    <line x1="800" y1="252" x2="800" y2="268" stroke="#fab387" stroke-width="3"/>
    <text x="765" y="284" font-family="monospace" font-size="13" font-weight="bold" fill="#fab387" text-anchor="middle">1</text>
    <text x="485" y="330" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#fab387" text-anchor="middle">Right edge: city 9 is (n - 1) - 8 = 1 km away ➔ max = 3</text>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ max(c[0], n-1-c[last], floor(gap / 2)) │ Sort numerically first │ O(m log m) Time</text>
</svg>
