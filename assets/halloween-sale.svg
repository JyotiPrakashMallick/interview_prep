<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowHS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes buy1 { 0%, 5% { opacity: 0.25; } 10%, 100% { opacity: 1; } }
    @keyframes buy2 { 0%, 18% { opacity: 0.25; } 23%, 100% { opacity: 1; } }
    @keyframes buy3 { 0%, 31% { opacity: 0.25; } 36%, 100% { opacity: 1; } }
    @keyframes buy4 { 0%, 44% { opacity: 0.25; } 49%, 100% { opacity: 1; } }
    @keyframes buy5 { 0%, 57% { opacity: 0.25; } 62%, 100% { opacity: 1; } }
    @keyframes w0 { 0%, 10% { opacity: 1; } 11%, 100% { opacity: 0; } }
    @keyframes w1 { 0%, 10% { opacity: 0; } 11%, 23% { opacity: 1; } 24%, 100% { opacity: 0; } }
    @keyframes w2 { 0%, 23% { opacity: 0; } 24%, 36% { opacity: 1; } 37%, 100% { opacity: 0; } }
    @keyframes w3 { 0%, 36% { opacity: 0; } 37%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes w4 { 0%, 49% { opacity: 0; } 50%, 62% { opacity: 1; } 63%, 100% { opacity: 0; } }
    @keyframes w5 { 0%, 62% { opacity: 0; } 63%, 100% { opacity: 1; } }
    @keyframes result { 0%, 70% { opacity: 0; } 78%, 100% { opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .b1 { animation: buy1 7s ease-in-out infinite; }
    .b2 { animation: buy2 7s ease-in-out infinite; }
    .b3 { animation: buy3 7s ease-in-out infinite; }
    .b4 { animation: buy4 7s ease-in-out infinite; }
    .b5 { animation: buy5 7s ease-in-out infinite; }
    .w0 { animation: w0 7s linear infinite; }
    .w1 { animation: w1 7s linear infinite; }
    .w2 { animation: w2 7s linear infinite; }
    .w3 { animation: w3 7s linear infinite; }
    .w4 { animation: w4 7s linear infinite; }
    .w5 { animation: w5 7s linear infinite; }
    .res { animation: result 7s ease-in-out infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgHS)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🎃 "Halloween Sale: Cheaper Every Game… Until the Floor!"</text>

  <!-- Mascot: pumpkin -->
  <g class="mascot" transform="translate(40, 60)">
    <ellipse cx="35" cy="38" rx="32" ry="27" fill="#fab387"/>
    <rect x="31" y="6" width="8" height="10" rx="2" fill="#a6e3a1"/>
    <path d="M 20 30 L 27 24 L 30 32 Z" fill="#11111b"/>
    <path d="M 50 30 L 43 24 L 40 32 Z" fill="#11111b"/>
    <path d="M 20 44 Q 35 56 50 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">p=20 d=3 m=6</text>
  </g>

  <!-- Wallet -->
  <g transform="translate(40, 170)" font-family="'Comic Sans MS', cursive, sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="80" height="60" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
    <text x="40" y="20" font-size="11" fill="#bac2de">👛 wallet</text>
    <g font-family="monospace" font-size="20" font-weight="bold" fill="#f9e2af">
      <text class="w0" x="40" y="47">70</text>
      <text class="w1" x="40" y="47">50</text>
      <text class="w2" x="40" y="47">33</text>
      <text class="w3" x="40" y="47">19</text>
      <text class="w4" x="40" y="47">8</text>
      <text class="w5" x="40" y="47">0</text>
    </g>
  </g>

  <!-- Price staircase: 20,17,14,11,8 then floor 6 -->
  <text x="470" y="80" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#89b4fa" text-anchor="middle">price = max(price − d, m)</text>
  <line x1="150" y1="290" x2="800" y2="290" stroke="#45475a" stroke-width="2"/>
  <line x1="150" y1="269" x2="800" y2="269" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="790" y="262" font-family="monospace" font-size="11" fill="#f38ba8" text-anchor="end">floor m = 6</text>

  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <!-- bar height = price * 7 -->
    <g class="b1"><rect x="170" y="150" width="60" height="140" rx="6" fill="#a6e3a1"/><text x="200" y="142" font-size="16" fill="#cdd6f4">20</text><text x="200" y="310" font-size="11" fill="#6c7086">game 1</text></g>
    <g class="b2"><rect x="250" y="171" width="60" height="119" rx="6" fill="#a6e3a1"/><text x="280" y="163" font-size="16" fill="#cdd6f4">17</text><text x="280" y="310" font-size="11" fill="#6c7086">game 2</text></g>
    <g class="b3"><rect x="330" y="192" width="60" height="98" rx="6" fill="#a6e3a1"/><text x="360" y="184" font-size="16" fill="#cdd6f4">14</text><text x="360" y="310" font-size="11" fill="#6c7086">game 3</text></g>
    <g class="b4"><rect x="410" y="213" width="60" height="77" rx="6" fill="#a6e3a1"/><text x="440" y="205" font-size="16" fill="#cdd6f4">11</text><text x="440" y="310" font-size="11" fill="#6c7086">game 4</text></g>
    <g class="b5"><rect x="490" y="234" width="60" height="56" rx="6" fill="#a6e3a1"/><text x="520" y="226" font-size="16" fill="#cdd6f4">8</text><text x="520" y="310" font-size="11" fill="#6c7086">game 5</text></g>
    <g opacity="0.3">
      <rect x="570" y="248" width="60" height="42" rx="6" fill="#585b70"/><text x="600" y="240" font-size="16" fill="#cdd6f4">6</text><text x="600" y="310" font-size="11" fill="#6c7086">game 6</text>
      <rect x="650" y="248" width="60" height="42" rx="6" fill="#585b70"/><text x="680" y="240" font-size="16" fill="#cdd6f4">6</text><text x="680" y="310" font-size="11" fill="#6c7086">…</text>
    </g>
  </g>
  <text x="640" y="212" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#bac2de" text-anchor="middle">8 − 3 = 5 → clamped to 6</text>

  <!-- Result -->
  <g class="res">
    <text x="470" y="345" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowHS)">✅ 20 + 17 + 14 + 11 + 8 = 70 ➔ 5 games (can't afford the 6th)</text>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ While s ≥ price: buy, then price = max(price − d, m) │ O(s / m) Time, O(1) Space</text>
</svg>
