<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgHour)"/>

  <!-- Title -->
  <text x="400" y="38" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">⏳ "The 6x6 Hourglass Explorer: 16 Windows, 1 Champion Sum!"</text>

  <!-- Left: 6x6 Matrix Diagram with sliding Hourglass stencil -->
  <g transform="translate(60, 65)">
    <rect width="280" height="200" rx="10" fill="#313244" stroke="#45475a" stroke-width="2"/>
    <text x="140" y="25" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">6×6 Grid (i: 0..5, j: 0..5)</text>

    <!-- Stencil of Hourglass Shape at row 1, col 2 -->
    <g transform="translate(35, 40)">
      <!-- Top 3 cells -->
      <rect x="30" y="20" width="30" height="25" fill="#f9e2af" rx="4"/>
      <rect x="70" y="20" width="30" height="25" fill="#f9e2af" rx="4"/>
      <rect x="110" y="20" width="30" height="25" fill="#f9e2af" rx="4"/>
      <text x="45" y="37" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">2</text>
      <text x="85" y="37" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">4</text>
      <text x="125" y="37" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">4</text>

      <!-- Mid 1 cell -->
      <rect x="70" y="55" width="30" height="25" fill="#fab387" rx="4"/>
      <text x="85" y="72" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">2</text>

      <!-- Bottom 3 cells -->
      <rect x="30" y="90" width="30" height="25" fill="#f9e2af" rx="4"/>
      <rect x="70" y="90" width="30" height="25" fill="#f9e2af" rx="4"/>
      <rect x="110" y="90" width="30" height="25" fill="#f9e2af" rx="4"/>
      <text x="45" y="107" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">1</text>
      <text x="85" y="107" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">2</text>
      <text x="125" y="107" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">4</text>
    </g>

    <text x="140" y="185" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" fill="#a6e3a1" text-anchor="middle">Sliding Window (4 × 4 = 16 positions)</text>
  </g>

  <!-- Big Animated Hourglass Mascot in Center -->
  <g transform="translate(380, 80)">
    <style>
      @keyframes sandFlow {
        0% { opacity: 0.3; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(15px); }
        100% { opacity: 0; transform: translateY(30px); }
      }
      .sandDrop { animation: sandFlow 1.2s infinite; }
    </style>
    <!-- Hourglass Outline -->
    <path d="M 10,10 L 90,10 L 55,65 L 90,120 L 10,120 L 45,65 Z" fill="#1e1e2e" stroke="#f9e2af" stroke-width="3"/>
    <!-- Top Sand -->
    <polygon points="20,20 80,20 50,60" fill="#fab387"/>
    <!-- Falling Sand droplets -->
    <circle class="sandDrop" cx="50" cy="65" r="2.5" fill="#f9e2af"/>
    <!-- Bottom Sand -->
    <polygon points="30,115 70,115 50,90" fill="#fab387"/>
    <text x="50" y="145" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#f9e2af" text-anchor="middle">Hourglass</text>
  </g>

  <!-- Calculation & Edge Case Banner -->
  <g transform="translate(510, 65)">
    <rect width="240" height="200" rx="10" fill="#11111b" stroke="#f38ba8" stroke-width="2"/>
    <text x="120" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">⚠️ Watch Negative Values!</text>
    <text x="120" y="52" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Values range from -9 to +9.</text>
    
    <rect x="20" y="70" width="200" height="50" rx="6" fill="#313244"/>
    <text x="120" y="90" font-family="monospace" font-size="11" fill="#eba0ac" text-anchor="middle">Min Sum = 7 × (-9) = -63</text>
    <text x="120" y="108" font-family="sans-serif" font-size="10" fill="#a6adc8" text-anchor="middle">Never initialize max with 0!</text>

    <!-- Formula -->
    <text x="120" y="145" font-family="monospace" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">Top(3) + Mid(1) + Bot(3)</text>
    <text x="120" y="165" font-family="monospace" font-size="13" font-weight="bold" fill="#f9e2af" text-anchor="middle">2+4+4 + 2 + 1+2+4 = 19 👑</text>
  </g>

  <!-- Footer -->
  <text x="400" y="295" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Constant Time O(1) &amp; Space O(1) — Exactly 16 Hourglasses evaluated!</text>
</svg>

