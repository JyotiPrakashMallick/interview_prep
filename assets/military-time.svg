<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgClock)"/>

  <!-- Title -->
  <text x="400" y="38" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">⏰ "12-Hour to 24-Hour Military Time Converter: Mind the 12s!"</text>

  <!-- Left: 12-Hour AM/PM Watch -->
  <g transform="translate(80, 70)">
    <circle cx="90" cy="90" r="75" fill="#313244" stroke="#f38ba8" stroke-width="4"/>
    <!-- Clock Hands -->
    <line x1="90" y1="90" x2="90" y2="35" stroke="#f9e2af" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="90" x2="135" y2="90" stroke="#f9e2af" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="90" r="5" fill="#f38ba8"/>
    <!-- Digital badge -->
    <rect x="35" y="120" width="110" height="30" rx="6" fill="#1e1e2e"/>
    <text x="90" y="141" font-family="monospace" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">07:05:45 PM</text>
    <text x="90" y="195" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">Civilian Clock ☀️</text>
  </g>

  <!-- Animated Gear / Transform Arrow in Center -->
  <g transform="translate(290, 110)">
    <style>
      @keyframes spinGear {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .rotatingGear { animation: spinGear 6s linear infinite; transform-origin: 40px 40px; }
    </style>
    <g class="rotatingGear">
      <circle cx="40" cy="40" r="30" fill="none" stroke="#f9e2af" stroke-width="6" stroke-dasharray="10 5"/>
      <circle cx="40" cy="40" r="8" fill="#f9e2af"/>
    </g>
    <!-- Arrow -->
    <path d="M 85,40 L 125,40 M 115,30 L 125,40 L 115,50" stroke="#a6e3a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="20" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6e3a1" text-anchor="middle">+12 Hours</text>
  </g>

  <!-- Right: 24-Hour Military Digital Display -->
  <g transform="translate(450, 70)">
    <rect width="280" height="150" rx="14" fill="#11111b" stroke="#a6e3a1" stroke-width="3"/>
    <text x="140" y="35" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1" text-anchor="middle">🪖 Military 24-Hour Time</text>
    <rect x="25" y="50" width="230" height="55" rx="8" fill="#1e1e2e"/>
    <text x="140" y="88" font-family="monospace" font-size="28" font-weight="bold" fill="#a6e3a1" text-anchor="middle" letter-spacing="2">19:05:45</text>
    <text x="140" y="130" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">07 + 12 = 19 hrs</text>
  </g>

  <!-- Critical Rules Footnote / Traps -->
  <g transform="translate(100, 235)">
    <rect width="600" height="48" rx="8" fill="#313244"/>
    <text x="300" y="20" font-family="monospace" font-size="12" fill="#f9e2af" text-anchor="middle">Midnight: "12:00:00AM" ➔ "00:00:00"  |  Noon: "12:00:00PM" ➔ "12:00:00"</text>
    <text x="300" y="38" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">All other PMs: add 12 to hours | All other AMs: keep hour unchanged</text>
  </g>

  <text x="400" y="305" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Constant Time O(1) &amp; Space O(1) String Slicing</text>
</svg>

