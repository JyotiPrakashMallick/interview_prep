<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgDup)"/>

  <!-- Title -->
  <text x="400" y="38" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🔍 "Bouncer at the Door: Spot the First Duplicate with a HashSet!"</text>

  <!-- Left: Array Conveyor Belt -->
  <g transform="translate(50, 70)">
    <rect width="320" height="150" rx="10" fill="#313244" stroke="#45475a" stroke-width="2"/>
    <text x="160" y="25" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4" text-anchor="middle">📥 Incoming Array Stream</text>
    <text x="160" y="48" font-family="monospace" font-size="12" fill="#a6adc8" text-anchor="middle">[3,  1,  4,  2,  5,  1,  6]</text>

    <!-- Scanning pointer animation -->
    <style>
      @keyframes scanFinger {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(120px); }
      }
      .animScan { animation: scanFinger 2s ease-in-out infinite; }
    </style>
    <!-- Scanning indicator -->
    <g class="animScan" transform="translate(60, 60)">
      <circle cx="20" cy="20" r="16" fill="#f9e2af"/>
      <text x="20" y="26" font-family="monospace" font-size="15" font-weight="bold" fill="#11111b" text-anchor="middle">1</text>
      <text x="20" y="55" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#f9e2af" text-anchor="middle">Scanning</text>
    </g>
  </g>

  <!-- Bouncer / Gatekeeper in Center -->
  <g transform="translate(390, 80)">
    <circle cx="30" cy="30" r="24" fill="#fab387"/>
    <!-- Sunglasses (Bouncer) -->
    <rect x="14" y="22" width="14" height="8" rx="2" fill="#11111b"/>
    <rect x="32" y="22" width="14" height="8" rx="2" fill="#11111b"/>
    <line x1="28" y1="26" x2="32" y2="26" stroke="#11111b" stroke-width="2"/>
    <!-- Smirk -->
    <path d="M 22,38 Q 30,44 38,38" stroke="#11111b" stroke-width="2" fill="none"/>
    <text x="30" y="75" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#fab387" text-anchor="middle">HashSet</text>
    <text x="30" y="90" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#fab387" text-anchor="middle">Bouncer</text>
  </g>

  <!-- Right: HashSet VIP Club -->
  <g transform="translate(480, 70)">
    <rect width="270" height="150" rx="10" fill="#11111b" stroke="#a6e3a1" stroke-width="2"/>
    <text x="135" y="25" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">🎟️ Seen VIP Club (Set.has?)</text>

    <!-- Inside the set -->
    <g transform="translate(30, 45)">
      <circle cx="20" cy="20" r="14" fill="#313244"/>
      <text x="20" y="25" font-family="monospace" font-size="12" fill="#cdd6f4" text-anchor="middle">3</text>

      <circle cx="60" cy="20" r="14" fill="#f38ba8" stroke="#f9e2af" stroke-width="2"/>
      <text x="60" y="25" font-family="monospace" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">1</text>

      <circle cx="100" cy="20" r="14" fill="#313244"/>
      <text x="100" y="25" font-family="monospace" font-size="12" fill="#cdd6f4" text-anchor="middle">4</text>

      <circle cx="140" cy="20" r="14" fill="#313244"/>
      <text x="140" y="25" font-family="monospace" font-size="12" fill="#cdd6f4" text-anchor="middle">2</text>

      <circle cx="180" cy="20" r="14" fill="#313244"/>
      <text x="180" y="25" font-family="monospace" font-size="12" fill="#cdd6f4" text-anchor="middle">5</text>
    </g>

    <!-- Alarm on second '1' -->
    <rect x="25" y="95" width="220" height="35" rx="6" fill="#f38ba8"/>
    <text x="135" y="117" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#11111b" text-anchor="middle">🚨 '1' already in Set! MATCH!</text>
  </g>

  <!-- Bottom Pro-Tip -->
  <text x="400" y="295" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af" text-anchor="middle">⚡ Brute Force: O(n²) Nested Loops  vs  HashSet: O(n) Time + O(n) Space!</text>
</svg>

