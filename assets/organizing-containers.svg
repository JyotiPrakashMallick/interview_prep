<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="greenBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <linearGradient id="redBall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="glowSwap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .math { font-family: 'Courier New', monospace; font-size: 13px; fill: #facc15; font-weight: bold; }
    .badge-pass { fill: #22c55e; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 800; }
    .badge-fail { fill: #ef4444; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 800; }
    .ball-text { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }

    /* Keyframe Animations */
    @keyframes swapLeft {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(190px, -20px); }
    }
    @keyframes swapRight {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-190px, 20px); }
    }
    @keyframes pulseCard {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
    }

    .anim-swap-1 { animation: swapLeft 4s infinite ease-in-out; }
    .anim-swap-2 { animation: swapRight 4s infinite ease-in-out; }
    .pulsing { animation: pulseCard 3s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Header Banner -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="0" r="14" fill="#38bdf8" opacity="0.2" />
    <text x="16" y="5" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="900">&#x2696;</text>
    <text x="40" y="5" class="title">Organizing Containers of Balls</text>
    <text x="40" y="25" class="subtitle">Preservation of Invariant: Swaps conserve Container Capacities (Row Sums == Col Sums)</text>
  </g>

  <!-- Left Card: The Swap Operation & Capacity Conservation -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="405" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. THE SWAP OPERATION INVARIANT</text>
    <text x="24" y="54" class="subtitle">Swapping 1 ball from C&#x2080; with 1 ball from C&#x2081; preserves capacities!</text>

    <!-- Container 0 Visual -->
    <g transform="translate(30, 80)">
      <polygon points="10,40 25,120 115,120 130,40" fill="#0f172a" stroke="#64748b" stroke-width="2.5" />
      <text x="70" y="25" text-anchor="middle" class="label">Container 0</text>
      <text x="70" y="145" text-anchor="middle" class="math">Capacity = 5</text>

      <!-- Balls in C0: 1 green, 4 red -->
      <circle cx="50" cy="65" r="12" fill="url(#greenBall)" />
      <text x="50" y="65" class="ball-text">0</text>

      <circle cx="85" cy="65" r="12" fill="url(#redBall)" />
      <text x="85" y="65" class="ball-text">1</text>

      <circle cx="45" cy="95" r="12" fill="url(#redBall)" />
      <text x="45" y="95" class="ball-text">1</text>

      <circle cx="75" cy="100" r="12" fill="url(#redBall)" />
      <text x="75" y="100" class="ball-text">1</text>

      <!-- Animated Red Ball Swapping to C1 -->
      <g class="anim-swap-1">
        <circle cx="105" cy="85" r="13" fill="url(#redBall)" stroke="#ffffff" stroke-width="1.5" />
        <text x="105" y="85" class="ball-text">1</text>
      </g>
    </g>

    <!-- Swap Indicator Curves -->
    <g transform="translate(180, 140)">
      <path d="M 0,-15 Q 25,-40 50,-15" fill="none" stroke="url(#glowSwap)" stroke-width="2.5" stroke-dasharray="4 2" />
      <polygon points="52,-15 47,-25 42,-18" fill="#818cf8" />

      <path d="M 50,15 Q 25,40 0,15" fill="none" stroke="url(#glowSwap)" stroke-width="2.5" stroke-dasharray="4 2" />
      <polygon points="-2,15 3,25 8,18" fill="#38bdf8" />

      <rect x="10" y="-12" width="30" height="24" rx="4" fill="#0f172a" />
      <text x="25" y="4" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="900">&#x21C4;</text>
    </g>

    <!-- Container 1 Visual -->
    <g transform="translate(245, 80)">
      <polygon points="10,40 25,120 115,120 130,40" fill="#0f172a" stroke="#64748b" stroke-width="2.5" />
      <text x="70" y="25" text-anchor="middle" class="label">Container 1</text>
      <text x="70" y="145" text-anchor="middle" class="math">Capacity = 5</text>

      <!-- Balls in C1: 2 green, 3 red -->
      <circle cx="50" cy="65" r="12" fill="url(#redBall)" />
      <text x="50" y="65" class="ball-text">1</text>

      <circle cx="85" cy="65" r="12" fill="url(#redBall)" />
      <text x="85" y="65" class="ball-text">1</text>

      <circle cx="95" cy="95" r="12" fill="url(#redBall)" />
      <text x="95" y="95" class="ball-text">1</text>

      <circle cx="65" cy="100" r="12" fill="url(#greenBall)" />
      <text x="65" y="100" class="ball-text">0</text>

      <!-- Animated Green Ball Swapping to C0 -->
      <g class="anim-swap-2">
        <circle cx="35" cy="85" r="13" fill="url(#greenBall)" stroke="#ffffff" stroke-width="1.5" />
        <text x="35" y="85" class="ball-text">0</text>
      </g>
    </g>

    <!-- Invariant Law Callout Box -->
    <g transform="translate(24, 245)">
      <rect width="357" height="60" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">&#x2139; Conservation Rule:</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Each swap is strictly 1-for-1. No container can grow or shrink!</text>
    </g>
  </g>

  <!-- Right Card: Matrix Sums & Multi-Set Match Algorithm -->
  <g transform="translate(475, 95)" filter="url(#shadow)">
    <rect width="405" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. MATRIX SUMS &#x21C4; MULTISET MATCHING</text>
    <text x="24" y="54" class="subtitle">Comparing Row Capacities vs Total Ball Type Counts</text>

    <!-- Matrix Grid visual -->
    <g transform="translate(24, 75)">
      <!-- Column Header -->
      <text x="105" y="14" class="label" text-anchor="middle">Type 0</text>
      <text x="175" y="14" class="label" text-anchor="middle">Type 1</text>
      <text x="245" y="14" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Row Sum</text>

      <!-- Row 0 -->
      <text x="45" y="48" class="label" text-anchor="end">C&#x2080;</text>
      <rect x="75" y="28" width="60" height="32" rx="4" fill="#1e293b" stroke="#475569" />
      <text x="105" y="49" class="math" text-anchor="middle" fill="#4ade80">1</text>

      <rect x="145" y="28" width="60" height="32" rx="4" fill="#1e293b" stroke="#475569" />
      <text x="175" y="49" class="math" fill="#f87171" text-anchor="middle">4</text>

      <rect x="220" y="28" width="55" height="32" rx="4" fill="#0f172a" stroke="#38bdf8" />
      <text x="247" y="49" class="math" text-anchor="middle">5</text>

      <!-- Row 1 -->
      <text x="45" y="88" class="label" text-anchor="end">C&#x2081;</text>
      <rect x="75" y="68" width="60" height="32" rx="4" fill="#1e293b" stroke="#475569" />
      <text x="105" y="89" class="math" text-anchor="middle" fill="#4ade80">2</text>

      <rect x="145" y="68" width="60" height="32" rx="4" fill="#1e293b" stroke="#475569" />
      <text x="175" y="89" class="math" fill="#f87171" text-anchor="middle">3</text>

      <rect x="220" y="68" width="55" height="32" rx="4" fill="#0f172a" stroke="#38bdf8" />
      <text x="247" y="89" class="math" text-anchor="middle">5</text>

      <!-- Col Sums -->
      <text x="45" y="125" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">Col Sum</text>
      <rect x="75" y="108" width="60" height="26" rx="4" fill="#0f172a" stroke="#facc15" />
      <text x="105" y="125" class="math" text-anchor="middle">3</text>

      <rect x="145" y="108" width="60" height="26" rx="4" fill="#0f172a" stroke="#facc15" />
      <text x="175" y="125" class="math" text-anchor="middle">7</text>
    </g>

    <!-- Sorted Arrays Comparison Box -->
    <g transform="translate(24, 230)">
      <rect width="357" height="75" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="24" class="label">Sorted Capacities (Row Sums):</text>
      <text x="230" y="24" class="math">[ 5, 5 ]</text>

      <text x="14" y="46" class="label">Sorted Ball Types (Col Sums):</text>
      <text x="230" y="46" class="math">[ 3, 7 ]</text>

      <line x1="14" y1="56" x2="343" y2="56" stroke="#1e293b" stroke-width="1.5" />

      <text x="14" y="69" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Verdict: [5, 5] &#x2260; [3, 7] &#x2192;</text>
      <text x="180" y="69" class="badge-fail">IMPOSSIBLE</text>
    </g>
  </g>
</svg>
