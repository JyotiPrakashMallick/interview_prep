<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowMD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes pairA { 0%, 5% { opacity: 0; } 10%, 40% { opacity: 1; } 45%, 100% { opacity: 0.25; } }
    @keyframes pairB { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes best { 0%, 60% { opacity: 0; } 70%, 100% { opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .pA { animation: pairA 6s ease-in-out infinite; }
    .pB { animation: pairB 6s ease-in-out infinite; }
    .best { animation: best 6s ease-in-out infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgMD)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">📏 "Minimum Distances: How Close Are the Twins?"</text>

  <!-- Mascot -->
  <g class="mascot" transform="translate(40, 60)">
    <circle cx="35" cy="35" r="30" fill="#cba6f7"/>
    <circle cx="25" cy="30" r="4" fill="#11111b"/>
    <circle cx="45" cy="30" r="4" fill="#11111b"/>
    <path d="M 22 44 Q 35 54 48 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">"Find my twin!"</text>
  </g>

  <!-- Array: [3, 2, 1, 2, 3] -->
  <text x="475" y="80" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#89b4fa" text-anchor="middle">a = [3, 2, 1, 2, 3]</text>
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <rect x="235" y="150" width="80" height="60" rx="10" fill="#313244"/>
    <text x="275" y="190" font-size="26" fill="#fab387">3</text>
    <text x="275" y="228" font-size="12" fill="#6c7086">i=0</text>

    <rect x="335" y="150" width="80" height="60" rx="10" fill="#313244"/>
    <text x="375" y="190" font-size="26" fill="#89b4fa">2</text>
    <text x="375" y="228" font-size="12" fill="#6c7086">i=1</text>

    <rect x="435" y="150" width="80" height="60" rx="10" fill="#313244"/>
    <text x="475" y="190" font-size="26" fill="#cdd6f4">1</text>
    <text x="475" y="228" font-size="12" fill="#6c7086">i=2</text>

    <rect x="535" y="150" width="80" height="60" rx="10" fill="#313244"/>
    <text x="575" y="190" font-size="26" fill="#89b4fa">2</text>
    <text x="575" y="228" font-size="12" fill="#6c7086">i=3</text>

    <rect x="635" y="150" width="80" height="60" rx="10" fill="#313244"/>
    <text x="675" y="190" font-size="26" fill="#fab387">3</text>
    <text x="675" y="228" font-size="12" fill="#6c7086">i=4</text>
  </g>

  <!-- Pair of 3's: distance 4 (big arc above) -->
  <g class="pA">
    <path d="M 275 146 Q 475 70 675 146" stroke="#fab387" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
    <text x="475" y="104" font-family="monospace" font-size="15" font-weight="bold" fill="#fab387" text-anchor="middle">|4 − 0| = 4</text>
  </g>

  <!-- Pair of 2's: distance 2 (small arc below) -->
  <g class="pB">
    <path d="M 375 240 Q 475 290 575 240" stroke="#89b4fa" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
    <text x="475" y="292" font-family="monospace" font-size="15" font-weight="bold" fill="#89b4fa" text-anchor="middle">|3 − 1| = 2</text>
  </g>

  <!-- Result -->
  <g class="best">
    <rect x="335" y="150" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowMD)"/>
    <rect x="535" y="150" width="80" height="60" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" filter="url(#glowMD)"/>
    <text x="475" y="330" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowMD)">✅ min(4, 2) = 2</text>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Remember last index of each value │ No twins ➔ −1 │ O(n) Time, O(n) Space</text>
</svg>
