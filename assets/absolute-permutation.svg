<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e31" />
      <stop offset="100%" stop-color="#28354f" />
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="blockA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="blockB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .math { font-family: 'Courier New', monospace; font-size: 13px; fill: #facc15; font-weight: bold; }
    .num { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .idx { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; text-anchor: middle; }

    /* Animated Swapping Curve */
    @keyframes pulseSwap {
      0%, 100% { opacity: 0.8; stroke-width: 2; }
      50% { opacity: 1; stroke-width: 3; stroke: #38bdf8; }
    }
    .swap-curve { animation: pulseSwap 2s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="0" r="14" fill="#38bdf8" opacity="0.2" />
    <text x="16" y="5" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="900">&#x2694;</text>
    <text x="40" y="5" class="title">Absolute Permutation</text>
    <text x="40" y="25" class="subtitle">Constraint: |pos[i] - i| = k &#x2192; Swap Pairs in 2k Sized Blocks (n % 2k == 0)</text>
  </g>

  <!-- Left Card: Block Permutation Example (n=4, k=2) -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="425" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. BLOCK SWAPPING LOGIC (n = 4, k = 2)</text>
    <text x="24" y="52" class="subtitle">Block size = 2k = 4. Group [1, 2] &#x21C4; Group [3, 4]</text>

    <!-- Original Array vs Result -->
    <g transform="translate(30, 80)">
      <!-- Original Positions -->
      <text x="0" y="24" class="label">Index i:</text>
      <text x="65" y="24" class="idx">i = 1</text>
      <text x="135" y="24" class="idx">i = 2</text>
      <text x="205" y="24" class="idx">i = 3</text>
      <text x="275" y="24" class="idx">i = 4</text>

      <!-- Original values boxes -->
      <g transform="translate(45, 35)">
        <!-- Box 1 -->
        <rect x="0" y="0" width="40" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <text x="20" y="19" class="num" fill="#38bdf8">1</text>

        <!-- Box 2 -->
        <rect x="70" y="0" width="40" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
        <text x="90" y="19" class="num" fill="#38bdf8">2</text>

        <!-- Box 3 -->
        <rect x="140" y="0" width="40" height="36" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
        <text x="160" y="19" class="num" fill="#a855f7">3</text>

        <!-- Box 4 -->
        <rect x="210" y="0" width="40" height="36" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
        <text x="230" y="19" class="num" fill="#a855f7">4</text>
      </g>

      <!-- Swap Arcs -->
      <g transform="translate(45, 75)">
        <!-- 1 <-> 3 -->
        <path class="swap-curve" d="M 20, 0 C 20, 35 160, 35 160, 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
        <text x="90" y="28" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">&#x21C4; +2 / -2</text>

        <!-- 2 <-> 4 -->
        <path class="swap-curve" d="M 90, 0 C 90, 45 230, 45 230, 0" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2" />
      </g>

      <!-- Resulting Permutation Array -->
      <g transform="translate(0, 140)">
        <text x="0" y="24" class="label" fill="#facc15">pos[i]:</text>
        <g transform="translate(45, 5)">
          <rect x="0" y="0" width="40" height="36" rx="6" fill="url(#blockB)" />
          <text x="20" y="19" class="num">3</text>

          <rect x="70" y="0" width="40" height="36" rx="6" fill="url(#blockB)" />
          <text x="90" y="19" class="num">4</text>

          <rect x="140" y="0" width="40" height="36" rx="6" fill="url(#blockA)" />
          <text x="160" y="19" class="num">1</text>

          <rect x="210" y="0" width="40" height="36" rx="6" fill="url(#blockA)" />
          <text x="230" y="19" class="num">2</text>
        </g>
      </g>
    </g>

    <!-- Verification notes -->
    <g transform="translate(24, 255)">
      <rect width="377" height="48" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">&#x2714; Absolute Differences Verified:</text>
      <text x="14" y="36" class="math">|3-1|=2, |4-2|=2, |1-3|=2, |2-4|=2</text>
    </g>
  </g>

  <!-- Right Card: Mathematical Rule & Divisibility Proof -->
  <g transform="translate(485, 95)" filter="url(#shadow)">
    <rect width="395" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. MATHEMATICAL EXISTENCE CRITERIA</text>
    <text x="24" y="52" class="subtitle">Why n % (2k) === 0 is Necessary &amp; Sufficient</text>

    <!-- Case 1: k == 0 -->
    <g transform="translate(24, 75)">
      <rect width="347" height="52" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x25AA; Special Case: k = 0</text>
      <text x="14" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">|pos[i] - i| = 0 &#x2192; pos[i] = i (Identity: [1, 2, ..., n])</text>
    </g>

    <!-- Case 2: Divisible vs Non-Divisible -->
    <g transform="translate(24, 138)">
      <rect width="347" height="98" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="22" fill="#facc15" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x25AA; Divisibility Condition (k &gt; 0):</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Position 1 has only one choice: pos[1] = 1 + k.</text>
      <text x="14" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">This strictly forces full block exchanges of size 2k.</text>
      <line x1="14" y1="68" x2="333" y2="68" stroke="#1e293b" />
      <text x="14" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">&#x2718; If n % (2k) &#x2260; 0 &#x2192; Orphaned elements &#x2192; [-1]</text>
    </g>

    <!-- Example check -->
    <g transform="translate(24, 250)">
      <rect width="347" height="55" rx="8" fill="#0f172a" stroke="#a855f7" />
      <text x="14" y="22" class="label" fill="#c084fc">Example Query: n = 3, k = 2</text>
      <text x="14" y="42" font-family="'Courier New', monospace" font-size="12" fill="#ef4444">3 % (2 &#xD7; 2) = 3 &#x2260; 0 &#x2192; Output: [-1]</text>
    </g>
  </g>
</svg>
