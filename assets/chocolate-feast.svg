<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowCF" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
    <!-- a chocolate bar -->
    <g id="bar">
      <rect x="0" y="0" width="34" height="22" rx="4" fill="#8b5a3c" stroke="#5c3a24" stroke-width="1.5"/>
      <line x1="11" y1="2" x2="11" y2="20" stroke="#5c3a24" stroke-width="1"/>
      <line x1="23" y1="2" x2="23" y2="20" stroke="#5c3a24" stroke-width="1"/>
      <line x1="2" y1="11" x2="32" y2="11" stroke="#5c3a24" stroke-width="1"/>
    </g>
  </defs>

  <style>
    @keyframes r1 { 0%, 5% { opacity: 0; } 10%, 100% { opacity: 1; } }
    @keyframes r2 { 0%, 28% { opacity: 0; } 33%, 100% { opacity: 1; } }
    @keyframes r3 { 0%, 51% { opacity: 0; } 56%, 100% { opacity: 1; } }
    @keyframes r4 { 0%, 74% { opacity: 0; } 79%, 100% { opacity: 1; } }
    @keyframes total { 0%, 84% { opacity: 0; } 90%, 100% { opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .row1 { animation: r1 8s ease-in-out infinite; }
    .row2 { animation: r2 8s ease-in-out infinite; }
    .row3 { animation: r3 8s ease-in-out infinite; }
    .row4 { animation: r4 8s ease-in-out infinite; }
    .tot { animation: total 8s ease-in-out infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgCF)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🍫 "Chocolate Feast: Eat, Save Wrappers, Trade, Repeat!"</text>

  <!-- Mascot -->
  <g class="mascot" transform="translate(40, 60)">
    <circle cx="35" cy="35" r="30" fill="#cba6f7"/>
    <circle cx="25" cy="30" r="4" fill="#11111b"/>
    <circle cx="45" cy="30" r="4" fill="#11111b"/>
    <path d="M 22 44 Q 35 54 48 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">n=15 c=3 m=2</text>
  </g>

  <!-- Column headers -->
  <g font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="210" y="74" fill="#89b4fa">step</text>
    <text x="440" y="74" fill="#fab387">bars eaten</text>
    <text x="700" y="74" fill="#f9e2af">wrappers left</text>
  </g>

  <!-- Row 1: buy 5 -->
  <g class="row1" transform="translate(140, 88)">
    <rect x="0" y="0" width="660" height="52" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="70" y="31" font-family="monospace" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">buy 15 / 3</text>
    <use href="#bar" x="160" y="15"/><use href="#bar" x="200" y="15"/><use href="#bar" x="240" y="15"/><use href="#bar" x="280" y="15"/><use href="#bar" x="320" y="15"/>
    <text x="400" y="32" font-family="monospace" font-size="15" font-weight="bold" fill="#fab387">+5</text>
    <text x="560" y="32" font-family="monospace" font-size="14" fill="#f9e2af" text-anchor="middle">5</text>
  </g>

  <!-- Row 2: trade 4 -> 2 -->
  <g class="row2" transform="translate(140, 148)">
    <rect x="0" y="0" width="660" height="52" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="70" y="31" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">trade 4 ➔ 2</text>
    <use href="#bar" x="160" y="15"/><use href="#bar" x="200" y="15"/>
    <text x="400" y="32" font-family="monospace" font-size="15" font-weight="bold" fill="#fab387">+2</text>
    <text x="560" y="32" font-family="monospace" font-size="14" fill="#f9e2af" text-anchor="middle">5 % 2 + 2 = 3</text>
  </g>

  <!-- Row 3: trade 2 -> 1 -->
  <g class="row3" transform="translate(140, 208)">
    <rect x="0" y="0" width="660" height="52" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="70" y="31" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">trade 2 ➔ 1</text>
    <use href="#bar" x="160" y="15"/>
    <text x="400" y="32" font-family="monospace" font-size="15" font-weight="bold" fill="#fab387">+1</text>
    <text x="560" y="32" font-family="monospace" font-size="14" fill="#f9e2af" text-anchor="middle">3 % 2 + 1 = 2</text>
  </g>

  <!-- Row 4: trade 2 -> 1 -->
  <g class="row4" transform="translate(140, 268)">
    <rect x="0" y="0" width="660" height="52" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="70" y="31" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">trade 2 ➔ 1</text>
    <use href="#bar" x="160" y="15"/>
    <text x="400" y="32" font-family="monospace" font-size="15" font-weight="bold" fill="#fab387">+1</text>
    <text x="560" y="32" font-family="monospace" font-size="14" fill="#f9e2af" text-anchor="middle">2 % 2 + 1 = 1 (stop)</text>
  </g>

  <!-- Total -->
  <g class="tot">
    <text x="470" y="350" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowCF)">✅ 5 + 2 + 1 + 1 = 9 bars eaten</text>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ wrappers = wrappers % m + free │ Stop when wrappers &lt; m │ O(log_m(n/c)) Time, O(1) Space</text>
</svg>
