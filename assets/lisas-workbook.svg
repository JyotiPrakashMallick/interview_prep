<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowLW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    /* scan pages one by one: page 1 (special), page 2, page 3 */
    @keyframes p1 { 0%, 3% { opacity: 0; } 6%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes p2 { 0%, 36% { opacity: 0; } 39%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes p3 { 0%, 69% { opacity: 0; } 72%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes star { 0%, 6% { transform: scale(0); } 12%, 100% { transform: scale(1); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .s1 { animation: p1 9s ease-in-out infinite; }
    .s2 { animation: p2 9s ease-in-out infinite; }
    .s3 { animation: p3 9s ease-in-out infinite; }
    .star { animation: star 9s ease-out infinite; transform-origin: 331px 146px; transform-box: view-box; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgLW)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">📒 "Lisa's Workbook: Problem # = Page # is Special!"</text>

  <!-- Mascot -->
  <g class="mascot" transform="translate(30, 70)">
    <circle cx="35" cy="35" r="30" fill="#cba6f7"/>
    <circle cx="25" cy="30" r="4" fill="#11111b"/>
    <circle cx="45" cy="30" r="4" fill="#11111b"/>
    <path d="M 22 44 Q 35 54 48 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">"Lisa"</text>
  </g>

  <text x="490" y="66" font-family="monospace" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">arr = [4, 2], k = 3 (max 3 problems per page)</text>

  <!-- Page 1: Chapter 1, problems 1..3 -->
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <rect x="150" y="90" width="190" height="200" rx="8" fill="#313244" stroke="#585b70" stroke-width="2"/>
    <text x="245" y="114" font-size="12" fill="#fab387">Chapter 1</text>
    <rect x="170" y="130" width="150" height="34" rx="5" fill="#45475a"/><text x="245" y="152" font-size="14" fill="#cdd6f4">Problem 1</text>
    <rect x="170" y="172" width="150" height="34" rx="5" fill="#45475a"/><text x="245" y="194" font-size="14" fill="#cdd6f4">Problem 2</text>
    <rect x="170" y="214" width="150" height="34" rx="5" fill="#45475a"/><text x="245" y="236" font-size="14" fill="#cdd6f4">Problem 3</text>
    <text x="245" y="276" font-size="13" fill="#6c7086">Page 1</text>

    <!-- Page 2: Chapter 1, problem 4 -->
    <rect x="370" y="90" width="190" height="200" rx="8" fill="#313244" stroke="#585b70" stroke-width="2"/>
    <text x="465" y="114" font-size="12" fill="#fab387">Chapter 1</text>
    <rect x="390" y="130" width="150" height="34" rx="5" fill="#45475a"/><text x="465" y="152" font-size="14" fill="#cdd6f4">Problem 4</text>
    <text x="465" y="276" font-size="13" fill="#6c7086">Page 2</text>

    <!-- Page 3: Chapter 2, problems 1..2 (new chapter -> new page) -->
    <rect x="590" y="90" width="190" height="200" rx="8" fill="#313244" stroke="#585b70" stroke-width="2"/>
    <text x="685" y="114" font-size="12" fill="#94e2d5">Chapter 2</text>
    <rect x="610" y="130" width="150" height="34" rx="5" fill="#45475a"/><text x="685" y="152" font-size="14" fill="#cdd6f4">Problem 1</text>
    <rect x="610" y="172" width="150" height="34" rx="5" fill="#45475a"/><text x="685" y="194" font-size="14" fill="#cdd6f4">Problem 2</text>
    <text x="685" y="276" font-size="13" fill="#6c7086">Page 3</text>
  </g>

  <!-- Scan page 1: range 1..3 contains page 1 -> special -->
  <g class="s1">
    <rect x="146" y="86" width="198" height="208" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3" stroke-dasharray="8 5"/>
    <rect x="170" y="130" width="150" height="34" rx="5" fill="none" stroke="#a6e3a1" stroke-width="3"/>
    <text x="480" y="330" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowLW)">Page 1 holds problems 1..3 ➔ 1 ≤ 1 ≤ 3 ✓ Problem 1 is special!</text>
  </g>
  <text class="star" x="320" y="154" font-size="22">⭐</text>

  <!-- Scan page 2: range 4..4 does not contain 2 -->
  <g class="s2">
    <rect x="366" y="86" width="198" height="208" rx="10" fill="none" stroke="#f38ba8" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="480" y="330" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#f38ba8" text-anchor="middle">Page 2 holds problem 4..4 ➔ 2 is not in range ✗</text>
  </g>

  <!-- Scan page 3: range 1..2 does not contain 3 -->
  <g class="s3">
    <rect x="586" y="86" width="198" height="208" rx="10" fill="none" stroke="#f38ba8" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="480" y="330" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#f38ba8" text-anchor="middle">Page 3 holds problems 1..2 ➔ 3 is not in range ✗</text>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Special if first ≤ page ≤ last │ New chapter ➔ new page │ Total = 1 │ O(total pages) Time</text>
</svg>
