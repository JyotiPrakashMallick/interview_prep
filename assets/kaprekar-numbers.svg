<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowKap" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes splitLeft {
      0%, 25% { transform: translateX(0); }
      45%, 100% { transform: translateX(-28px); }
    }
    @keyframes splitRight {
      0%, 25% { transform: translateX(0); }
      45%, 100% { transform: translateX(28px); }
    }
    @keyframes snip {
      0%, 15% { transform: translateY(-40px); opacity: 0; }
      25% { transform: translateY(0); opacity: 1; }
      40% { transform: translateY(0); opacity: 1; }
      50%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes showResult {
      0%, 55% { opacity: 0; }
      70%, 100% { opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .lPart { animation: splitLeft 4s ease-in-out infinite; }
    .rPart { animation: splitRight 4s ease-in-out infinite; }
    .scissors { animation: snip 4s ease-in-out infinite; }
    .result { animation: showResult 4s ease-in-out infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgKap)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">✂️ "Modified Kaprekar Numbers: Square It, Snip It, Sum It!"</text>

  <!-- Mascot: a smiling number blob -->
  <g class="mascot" transform="translate(40, 60)">
    <circle cx="35" cy="35" r="30" fill="#cba6f7"/>
    <circle cx="25" cy="30" r="4" fill="#11111b"/>
    <circle cx="45" cy="30" r="4" fill="#11111b"/>
    <path d="M 22 44 Q 35 54 48 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">"Am I special?"</text>
  </g>

  <!-- Step labels -->
  <g font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="215" y="70" fill="#89b4fa">① n (d digits)</text>
    <text x="420" y="70" fill="#fab387">② n² → cut d digits from the right</text>
    <text x="680" y="70" fill="#a6e3a1">③ l + r == n ?</text>
  </g>

  <!-- ================= ROW 1: n = 45 (valid) ================= -->
  <g transform="translate(0, 85)">
    <rect x="140" y="0" width="660" height="80" rx="12" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
    <!-- n -->
    <rect x="180" y="18" width="70" height="44" rx="8" fill="#313244"/>
    <text x="215" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#89b4fa" text-anchor="middle">45</text>
    <text x="275" y="47" font-family="monospace" font-size="18" fill="#6c7086" text-anchor="middle">→</text>

    <!-- square split -->
    <g class="lPart">
      <rect x="330" y="18" width="60" height="44" rx="8" fill="#313244" stroke="#f9e2af"/>
      <text x="360" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#f9e2af" text-anchor="middle">20</text>
    </g>
    <g class="rPart">
      <rect x="392" y="18" width="60" height="44" rx="8" fill="#313244" stroke="#fab387"/>
      <text x="422" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#fab387" text-anchor="middle">25</text>
    </g>
    <g class="scissors">
      <line x1="391" y1="8" x2="391" y2="72" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="391" y="10" font-size="16" text-anchor="middle">✂️</text>
    </g>

    <!-- result -->
    <g class="result">
      <text x="680" y="40" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4" text-anchor="middle">20 + 25 = 45</text>
      <text x="680" y="64" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowKap)">✅ Kaprekar!</text>
    </g>
  </g>

  <!-- ================= ROW 2: n = 99 (valid, leading zero) ================= -->
  <g transform="translate(0, 180)">
    <rect x="140" y="0" width="660" height="80" rx="12" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
    <rect x="180" y="18" width="70" height="44" rx="8" fill="#313244"/>
    <text x="215" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#89b4fa" text-anchor="middle">99</text>
    <text x="275" y="47" font-family="monospace" font-size="18" fill="#6c7086" text-anchor="middle">→</text>

    <g class="lPart">
      <rect x="330" y="18" width="60" height="44" rx="8" fill="#313244" stroke="#f9e2af"/>
      <text x="360" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#f9e2af" text-anchor="middle">98</text>
    </g>
    <g class="rPart">
      <rect x="392" y="18" width="60" height="44" rx="8" fill="#313244" stroke="#fab387"/>
      <text x="422" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#fab387" text-anchor="middle">01</text>
    </g>
    <g class="scissors">
      <line x1="391" y1="8" x2="391" y2="72" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="391" y="10" font-size="16" text-anchor="middle">✂️</text>
    </g>

    <g class="result">
      <text x="680" y="34" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4" text-anchor="middle">98 + 1 = 99</text>
      <text x="680" y="54" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowKap)">✅ Kaprekar!</text>
      <text x="680" y="71" font-family="'Comic Sans MS', cursive, sans-serif" font-size="10" fill="#bac2de" text-anchor="middle">(r may have leading zeros)</text>
    </g>
  </g>

  <!-- ================= ROW 3: n = 5 (invalid) ================= -->
  <g transform="translate(0, 275)">
    <rect x="140" y="0" width="660" height="80" rx="12" fill="#181825" stroke="#f38ba8" stroke-width="2"/>
    <rect x="180" y="18" width="70" height="44" rx="8" fill="#313244"/>
    <text x="215" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#89b4fa" text-anchor="middle">5</text>
    <text x="275" y="47" font-family="monospace" font-size="18" fill="#6c7086" text-anchor="middle">→</text>

    <g class="lPart">
      <rect x="360" y="18" width="30" height="44" rx="8" fill="#313244" stroke="#f9e2af"/>
      <text x="375" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#f9e2af" text-anchor="middle">2</text>
    </g>
    <g class="rPart">
      <rect x="392" y="18" width="30" height="44" rx="8" fill="#313244" stroke="#fab387"/>
      <text x="407" y="48" font-family="monospace" font-size="22" font-weight="bold" fill="#fab387" text-anchor="middle">5</text>
    </g>
    <g class="scissors">
      <line x1="391" y1="8" x2="391" y2="72" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="391" y="10" font-size="16" text-anchor="middle">✂️</text>
    </g>

    <g class="result">
      <text x="680" y="40" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4" text-anchor="middle">2 + 5 = 7 ≠ 5</text>
      <text x="680" y="64" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">❌ Not Kaprekar</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Scan p..q, test each n │ 1..100 ➔ 1 9 45 55 99 │ None found ➔ "INVALID RANGE" │ O((q−p)·d) Time</text>
</svg>
