<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e31" />
      <stop offset="100%" stop-color="#24304f" />
    </linearGradient>

    <!-- Match Gradient (Prefix) -->
    <linearGradient id="prefixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Zeroed Bits Gradient -->
    <linearGradient id="zeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .mono { font-family: 'Courier New', monospace; font-size: 13px; fill: #facc15; font-weight: bold; }
    .bit-txt { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .idx { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }

    /* Animated pulse for common prefix */
    @keyframes pulsePrefix {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.7)); }
    }
    .prefix-glow { animation: pulsePrefix 2.5s infinite ease-in-out; }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="0" r="14" fill="#38bdf8" opacity="0.25" />
    <text x="16" y="5" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="900">&amp;</text>
    <text x="40" y="5" class="title">AND Product: Bitwise Range Reduction</text>
    <text x="40" y="25" class="subtitle">Bitwise AND over [a, b] = Longest Common Binary Prefix Padded with Zeros</text>
  </g>

  <!-- Left Card: Binary Breakdown of [10, 14] -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="435" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. BIT TRANSITIONS: a = 10 to b = 14</text>
    <text x="24" y="52" class="subtitle">Any bit that toggles between a and b becomes 0</text>

    <!-- Binary Rows Display -->
    <g transform="translate(30, 75)">
      <!-- Bit place values -->
      <text x="80" y="0" class="idx">2&#179; (8)</text>
      <text x="130" y="0" class="idx">2&#178; (4)</text>
      <text x="180" y="0" class="idx">2&#185; (2)</text>
      <text x="230" y="0" class="idx">2&#8304; (1)</text>

      <!-- Number 10 = 1 0 1 0 -->
      <g transform="translate(0, 15)">
        <text x="0" y="20" class="label">10 =</text>
        <rect x="60" y="2" width="40" height="30" rx="5" fill="url(#prefixGrad)" class="prefix-glow" />
        <text x="80" y="17" class="bit-txt">1</text>
        <rect x="110" y="2" width="40" height="30" rx="5" fill="#1e293b" stroke="#475569" />
        <text x="130" y="17" class="bit-txt">0</text>
        <rect x="160" y="2" width="40" height="30" rx="5" fill="#1e293b" stroke="#475569" />
        <text x="180" y="17" class="bit-txt">1</text>
        <rect x="210" y="2" width="40" height="30" rx="5" fill="#1e293b" stroke="#475569" />
        <text x="230" y="17" class="bit-txt">0</text>
      </g>

      <!-- Intermediate values hint -->
      <text x="80" y="70" class="idx">&#x22EE;</text>
      <text x="130" y="70" class="idx">&#x22EE;</text>
      <text x="180" y="70" class="idx">&#x22EE;</text>
      <text x="230" y="70" class="idx">&#x22EE;</text>

      <!-- Number 14 = 1 1 1 0 -->
      <g transform="translate(0, 75)">
        <text x="0" y="20" class="label">14 =</text>
        <rect x="60" y="2" width="40" height="30" rx="5" fill="url(#prefixGrad)" class="prefix-glow" />
        <text x="80" y="17" class="bit-txt">1</text>
        <rect x="110" y="2" width="40" height="30" rx="5" fill="#1e293b" stroke="#475569" />
        <text x="130" y="17" class="bit-txt">1</text>
        <rect x="160" y="2" width="40" height="30" rx="5" fill="#1e293b" stroke="#475569" />
        <text x="180" y="17" class="bit-txt">1</text>
        <rect x="210" y="2" width="40" height="30" rx="5" fill="#1e293b" stroke="#475569" />
        <text x="230" y="17" class="bit-txt">0</text>
      </g>

      <!-- Result Divider -->
      <line x1="0" y1="118" x2="260" y2="118" stroke="#334155" stroke-width="2" />

      <!-- Result 8 = 1 0 0 0 -->
      <g transform="translate(0, 128)">
        <text x="0" y="20" class="label" fill="#facc15">AND =</text>
        <!-- Common 1 preserved -->
        <rect x="60" y="2" width="40" height="30" rx="5" fill="url(#prefixGrad)" stroke="#34d399" stroke-width="2" />
        <text x="80" y="17" class="bit-txt">1</text>
        <!-- Toggled bits zeroed out -->
        <rect x="110" y="2" width="40" height="30" rx="5" fill="url(#zeroGrad)" />
        <text x="130" y="17" class="bit-txt">0</text>
        <rect x="160" y="2" width="40" height="30" rx="5" fill="url(#zeroGrad)" />
        <text x="180" y="17" class="bit-txt">0</text>
        <rect x="210" y="2" width="40" height="30" rx="5" fill="url(#zeroGrad)" />
        <text x="230" y="17" class="bit-txt">0</text>
      </g>
    </g>

    <!-- Summary Box -->
    <g transform="translate(24, 255)">
      <rect width="387" height="48" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399">&#x2714; Common Prefix Rule:</text>
      <text x="14" y="36" class="mono">Result = (1000)&#x2082; = 8</text>
    </g>
  </g>

  <!-- Right Card: Fast Algorithms -->
  <g transform="translate(495, 95)" filter="url(#shadow)">
    <rect width="385" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. KERNIGHAN &amp; SHIFT ALGORITHMS</text>
    <text x="24" y="52" class="subtitle">Two O(log N) &#x2264; 32 step solutions</text>

    <!-- Method 1 -->
    <g transform="translate(24, 75)">
      <rect width="337" height="65" rx="8" fill="#0f172a" stroke="#38bdf8" />
      <text x="14" y="20" class="label" fill="#38bdf8">Approach 1: Clear Lowest Bit of b</text>
      <text x="14" y="40" class="mono">while (b &gt; a) b &amp;= (b - 1);</text>
      <text x="14" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Drops non-matching trailing 1-bits</text>
    </g>

    <!-- Method 2 -->
    <g transform="translate(24, 150)">
      <rect width="337" height="65" rx="8" fill="#0f172a" stroke="#a855f7" />
      <text x="14" y="20" class="label" fill="#c084fc">Approach 2: Shift Until Equal</text>
      <text x="14" y="40" class="mono">while (a &lt; b) { a &gt;&gt;= 1; b &gt;&gt;= 1; }</text>
      <text x="14" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Isolates common prefix, then left shifts</text>
    </g>

    <!-- Efficiency Box -->
    <g transform="translate(24, 235)">
      <rect width="337" height="68" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="14" y="22" class="label" fill="#34d399">Complexity Proof:</text>
      <text x="14" y="42" class="mono">Time: &#x2264; 32 steps per query</text>
      <text x="14" y="58" class="mono">Space: O(1) auxiliary</text>
    </g>
  </g>
</svg>
