<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e31" />
      <stop offset="100%" stop-color="#24304f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .mono { font-family: 'Courier New', monospace; font-size: 13px; fill: #facc15; font-weight: bold; }
    .row { font-family: 'Courier New', monospace; font-size: 16px; fill: #e2e8f0; letter-spacing: 4px; }
    .col { font-family: 'Courier New', monospace; font-size: 16px; fill: #34d399; font-weight: bold; letter-spacing: 4px; }
  </style>

  <rect width="920" height="420" rx="16" fill="url(#bgGrad)" />

  <g transform="translate(40, 42)">
    <text x="0" y="5" class="title">Cipher: Decoding with a Sliding XOR Window</text>
    <text x="0" y="25" class="subtitle">s[i] = b[i] &#x2295; b[i-1] &#x2295; &#x2026; &#x2295; b[i-k+1] &#x2192; b[i] = s[i] &#x2295; (XOR of the previous k-1 decoded bits)</text>
  </g>

  <!-- Left: encoding grid -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="435" height="295" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. ENCODING (b = 1001011, k = 4)</text>
    <text x="24" y="52" class="subtitle">Each column of s XORs up to k neighbouring bits of b</text>

    <!-- highlight column 3 (4th column) -->
    <rect x="78.5" y="72" width="15" height="150" rx="3" fill="#a855f7" opacity="0.25" stroke="#a855f7" />

    <g transform="translate(40, 90)">
      <text x="0" y="0" class="row">1001011</text>
      <text x="13.6" y="28" class="row">1001011</text>
      <text x="27.2" y="56" class="row">1001011</text>
      <text x="40.8" y="84" class="row">1001011</text>
      <line x1="0" y1="98" x2="200" y2="98" stroke="#334155" stroke-width="1.5" />
      <text x="0" y="122" class="col">1110101001</text>
    </g>
    <text x="250" y="110" class="label">shift 0..3</text>
    <text x="250" y="214" class="label" fill="#34d399">encoded s</text>

    <g transform="translate(24, 238)">
      <rect width="387" height="42" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="14" y="26" class="mono">s[3] = b[3]&#x2295;b[2]&#x2295;b[1]&#x2295;b[0] = 1&#x2295;0&#x2295;0&#x2295;1 = 0</text>
    </g>
  </g>

  <!-- Right: decoding steps -->
  <g transform="translate(495, 90)" filter="url(#shadow)">
    <rect width="385" height="295" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. DECODING: O(1) PER BIT</text>
    <text x="24" y="52" class="subtitle">window = XOR of b[i-k+1 .. i-1]</text>

    <g transform="translate(24, 72)">
      <rect width="337" height="56" rx="8" fill="#0f172a" stroke="#38bdf8" />
      <text x="14" y="22" class="label" fill="#38bdf8">Decode:</text>
      <text x="14" y="42" class="mono">b[i] = s[i] ^ window</text>
    </g>

    <g transform="translate(24, 138)">
      <rect width="337" height="72" rx="8" fill="#0f172a" stroke="#a855f7" />
      <text x="14" y="22" class="label" fill="#c084fc">Slide the window:</text>
      <text x="14" y="42" class="mono">window ^= b[i]</text>
      <text x="14" y="60" class="mono">if i&#x2265;k-1: window ^= b[i-k+1]</text>
    </g>

    <g transform="translate(24, 220)">
      <rect width="337" height="58" rx="8" fill="#0f172a" stroke="#10b981" />
      <text x="14" y="22" class="label" fill="#34d399">Decoded first n = |s| - k + 1 = 7 bits:</text>
      <text x="14" y="44" class="mono">b = 1001011 &#x2714;</text>
    </g>
  </g>
</svg>
