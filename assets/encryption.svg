<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <!-- Cell Highlights -->
    <linearGradient id="col0Glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="col1Glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="col2Glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="col3Glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f9fafb; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #9ca3af; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #d1d5db; font-weight: 600; }
    .mono { font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #f3f4f6; }
    .tag { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: #ffffff; }

    /* Animated scanning beam */
    @keyframes scanCols {
      0% { transform: translateX(0px); opacity: 0.9; }
      25% { transform: translateX(65px); opacity: 0.9; }
      50% { transform: translateX(130px); opacity: 0.9; }
      75% { transform: translateX(195px); opacity: 0.9; }
      100% { transform: translateX(0px); opacity: 0.9; }
    }
    .scanner { animation: scanCols 5s infinite ease-in-out; }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="0" r="14" fill="#38bdf8" opacity="0.2" />
    <text x="16" y="5" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="900">&#x1F510;</text>
    <text x="40" y="5" class="title">Grid Cipher: Encryption Algorithm</text>
    <text x="40" y="25" class="subtitle">Dimensions: &#x230A;&#x221A;L&#x230B; &#x2264; rows &#x2264; cols &#x2264; &#x2308;&#x221A;L&#x2309; &#x2192; Transposed Column-Wise Readout</text>
  </g>

  <!-- Left Card: Matrix Construction (Example: haveaniceday, L=12) -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="415" height="325" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. GRID PACKING: "haveaniceday"</text>
    <text x="24" y="52" class="subtitle">L = 12 &#x2192; &#x221A;12 &#x2248; 3.46 &#x2192; rows = 3, cols = 4 (3 &#xD7; 4 = 12 &#x2265; 12)</text>

    <!-- Column labels -->
    <g transform="translate(45, 80)">
      <text x="35" y="0" text-anchor="middle" class="label" fill="#38bdf8">Col 0</text>
      <text x="100" y="0" text-anchor="middle" class="label" fill="#a855f7">Col 1</text>
      <text x="165" y="0" text-anchor="middle" class="label" fill="#10b981">Col 2</text>
      <text x="230" y="0" text-anchor="middle" class="label" fill="#f59e0b">Col 3</text>

      <!-- Row 0: h a v e -->
      <g transform="translate(10, 15)">
        <rect x="0" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
        <text x="25" y="22" class="mono" text-anchor="middle" dominant-baseline="central">h</text>

        <rect x="65" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
        <text x="90" y="22" class="mono" text-anchor="middle" dominant-baseline="central">a</text>

        <rect x="130" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5" />
        <text x="155" y="22" class="mono" text-anchor="middle" dominant-baseline="central">v</text>

        <rect x="195" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
        <text x="220" y="22" class="mono" text-anchor="middle" dominant-baseline="central">e</text>
      </g>

      <!-- Row 1: a n i c -->
      <g transform="translate(10, 65)">
        <rect x="0" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
        <text x="25" y="22" class="mono" text-anchor="middle" dominant-baseline="central">a</text>

        <rect x="65" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
        <text x="90" y="22" class="mono" text-anchor="middle" dominant-baseline="central">n</text>

        <rect x="130" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5" />
        <text x="155" y="22" class="mono" text-anchor="middle" dominant-baseline="central">i</text>

        <rect x="195" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
        <text x="220" y="22" class="mono" text-anchor="middle" dominant-baseline="central">c</text>
      </g>

      <!-- Row 2: e d a y -->
      <g transform="translate(10, 115)">
        <rect x="0" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
        <text x="25" y="22" class="mono" text-anchor="middle" dominant-baseline="central">e</text>

        <rect x="65" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#a855f7" stroke-width="1.5" />
        <text x="90" y="22" class="mono" text-anchor="middle" dominant-baseline="central">d</text>

        <rect x="130" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#10b981" stroke-width="1.5" />
        <text x="155" y="22" class="mono" text-anchor="middle" dominant-baseline="central">a</text>

        <rect x="195" y="0" width="50" height="40" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1.5" />
        <text x="220" y="22" class="mono" text-anchor="middle" dominant-baseline="central">y</text>
      </g>

      <!-- Dynamic Scanning Beam Animation -->
      <rect class="scanner" x="6" y="10" width="58" height="150" rx="6" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2" />
    </g>

    <g transform="translate(24, 260)">
      <rect width="367" height="45" rx="6" fill="#111827" stroke="#374151" />
      <text x="14" y="27" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">&#x2139; Read vertically: Col 0 &#x2192; Col 1 &#x2192; Col 2 &#x2192; Col 3</text>
    </g>
  </g>

  <!-- Right Card: Column Output Assembly -->
  <g transform="translate(480, 95)" filter="url(#shadow)">
    <rect width="400" height="325" rx="12" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. ENCRYPTED OUTPUT TRANSFORMATION</text>
    <text x="24" y="52" class="subtitle">Extract each vertical stripe as a space-separated word</text>

    <!-- Transposed words block -->
    <g transform="translate(24, 75)">
      <!-- Word 0 -->
      <g transform="translate(0, 0)">
        <rect width="60" height="28" rx="6" fill="url(#col0Glow)" />
        <text x="30" y="14" class="tag">Col 0</text>
        <text x="75" y="19" class="mono" fill="#38bdf8">&#x2192; "h" + "a" + "e" = "hae"</text>
      </g>

      <!-- Word 1 -->
      <g transform="translate(0, 42)">
        <rect width="60" height="28" rx="6" fill="url(#col1Glow)" />
        <text x="30" y="14" class="tag">Col 1</text>
        <text x="75" y="19" class="mono" fill="#a855f7">&#x2192; "a" + "n" + "d" = "and"</text>
      </g>

      <!-- Word 2 -->
      <g transform="translate(0, 84)">
        <rect width="60" height="28" rx="6" fill="url(#col2Glow)" />
        <text x="30" y="14" class="tag">Col 2</text>
        <text x="75" y="19" class="mono" fill="#10b981">&#x2192; "v" + "i" + "a" = "via"</text>
      </g>

      <!-- Word 3 -->
      <g transform="translate(0, 126)">
        <rect width="60" height="28" rx="6" fill="url(#col3Glow)" />
        <text x="30" y="14" class="tag">Col 3</text>
        <text x="75" y="19" class="mono" fill="#f59e0b">&#x2192; "e" + "c" + "y" = "ecy"</text>
      </g>
    </g>

    <!-- Final Result Box -->
    <g transform="translate(24, 240)">
      <rect width="352" height="65" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5" />
      <text x="14" y="24" class="label" fill="#9ca3af">Final Encrypted String:</text>
      <text x="14" y="48" class="mono" fill="#facc15" font-size="16">"hae and via ecy"</text>
    </g>
  </g>
</svg>
