<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e2e" />
      <stop offset="100%" stop-color="#28334e" />
    </linearGradient>

    <!-- Isometric Cube Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="tallTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="tallLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be185d" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <linearGradient id="tallRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .math { font-family: 'Courier New', monospace; font-size: 13px; fill: #facc15; font-weight: bold; }
    .cube-txt { font-family: system-ui, sans-serif; font-size: 11px; fill: #ffffff; font-weight: 800; }

    /* Animated sunlight / exposure pulse */
    @keyframes pulseExposed {
      0%, 100% { opacity: 0.8; stroke-width: 1.5; }
      50% { opacity: 1; stroke-width: 2.5; stroke: #fde047; }
    }
    .exposed-edge { animation: pulseExposed 2.5s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="0" r="14" fill="#38bdf8" opacity="0.25" />
    <text x="16" y="5" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="900">&#x1F9CA;</text>
    <text x="40" y="5" class="title">3D Surface Area: Toy Cube Stacks</text>
    <text x="40" y="25" class="subtitle">Surface Formula: 2 (Top/Bottom) + &#x2211; max(0, h&#x1D62;&#x2C7C; - h_neighbor) for 4 Cardinal Directions</text>
  </g>

  <!-- Left Card: Isometric 3D Visualization of Stacks -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="430" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. EXPOSED LATERAL DIFFERENCES</text>
    <text x="24" y="52" class="subtitle">Exposed height facing neighbor = max(0, h&#x2081; - h&#x2082;)</text>

    <!-- Isometric rendering of stack h=1 vs stack h=3 -->
    <g transform="translate(60, 110)">
      <!-- Board Grid lines (ground plane) -->
      <polygon points="120,170 240,110 160,70 40,130" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

      <!-- Stack A: Height = 1 at (0, 0) -->
      <g transform="translate(80, 110)">
        <!-- Top face -->
        <polygon points="0,0 35,-18 70,0 35,18" fill="url(#topFace)" stroke="#0284c7" />
        <!-- Left face -->
        <polygon points="0,0 0,35 35,53 35,18" fill="url(#leftFace)" stroke="#0369a1" />
        <!-- Right face -->
        <polygon points="35,18 35,53 70,35 70,0" fill="url(#rightFace)" stroke="#0284c7" />
        <text x="35" y="3" text-anchor="middle" class="cube-txt">h = 1</text>
      </g>

      <!-- Stack B: Height = 3 at (0, 1) directly behind/adjacent -->
      <g transform="translate(140, 80)">
        <!-- Base / Mid cubes -->
        <polygon points="0,-70 0,35 35,53 35,-52" fill="url(#tallLeft)" stroke="#9d174d" />
        <polygon points="35,-52 35,53 70,35 70,-70" fill="url(#tallRight)" stroke="#e11d48" />
        <!-- Top face at h=3 -->
        <polygon points="0,-70 35,-88 70,-70 35,-52" fill="url(#tallTop)" stroke="#be185d" />
        <text x="35" y="-68" text-anchor="middle" class="cube-txt">h = 3</text>

        <!-- Highlight exposed portion above h=1: height diff = 3 - 1 = 2 -->
        <polygon class="exposed-edge" points="0,-70 0,0 35,18 35,-52" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="4 2" />
      </g>

      <!-- Arrow indicating height difference -->
      <g transform="translate(195, 30)">
        <line x1="0" y1="0" x2="35" y2="0" stroke="#facc15" stroke-width="2" />
        <text x="42" y="4" class="math">&#x394;h = 3 - 1 = 2</text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(24, 255)">
      <rect width="382" height="50" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">&#x2139; Overlap Rule:</text>
      <text x="14" y="38" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Shared faces between adjacent blocks are glued together and hidden.</text>
    </g>
  </g>

  <!-- Right Card: Mathematical Calculation & Direction Matrix -->
  <g transform="translate(490, 95)" filter="url(#shadow)">
    <rect width="390" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. CARDINAL DECOMPOSITION</text>
    <text x="24" y="52" class="subtitle">Contribution per cell (i, j) with height h &gt; 0</text>

    <!-- Table of face contributions -->
    <g transform="translate(24, 75)">
      <!-- Top/Bottom -->
      <g transform="translate(0, 0)">
        <rect width="342" height="38" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="24" class="label" fill="#38bdf8">Top &amp; Bottom Faces</text>
        <text x="245" y="24" class="math">+2 units</text>
      </g>

      <!-- North -->
      <g transform="translate(0, 44)">
        <rect width="342" height="34" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="22" class="label">North Face (i - 1, j)</text>
        <text x="200" y="22" class="math">max(0, h - A[i-1][j])</text>
      </g>

      <!-- South -->
      <g transform="translate(0, 84)">
        <rect width="342" height="34" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="22" class="label">South Face (i + 1, j)</text>
        <text x="200" y="22" class="math">max(0, h - A[i+1][j])</text>
      </g>

      <!-- West -->
      <g transform="translate(0, 124)">
        <rect width="342" height="34" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="22" class="label">West Face (i, j - 1)</text>
        <text x="200" y="22" class="math">max(0, h - A[i][j-1])</text>
      </g>

      <!-- East -->
      <g transform="translate(0, 164)">
        <rect width="342" height="34" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="22" class="label">East Face (i, j + 1)</text>
        <text x="200" y="22" class="math">max(0, h - A[i][j+1])</text>
      </g>
    </g>

    <!-- Complexity Tag -->
    <g transform="translate(24, 280)">
      <text x="0" y="16" class="label" fill="#a5b4fc">Boundary Condition:</text>
      <text x="135" y="16" class="math" fill="#38bdf8">neighbor = 0 (Outside board)</text>
    </g>
  </g>
</svg>
