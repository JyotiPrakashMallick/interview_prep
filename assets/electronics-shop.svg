<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f9e2af" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgShop)"/>

  <!-- Customer Cartoon (Budget Shopper) -->
  <g transform="translate(50, 60)">
    <style>
      @keyframes sweatDrop {
        0%, 100% { transform: translateY(0); opacity: 0; }
        50% { transform: translateY(12px); opacity: 1; }
      }
      .sweat { animation: sweatDrop 1.5s infinite; }
    </style>
    <!-- Wallet -->
    <rect x="20" y="110" width="80" height="55" rx="8" fill="#a6adc8" stroke="#fab387" stroke-width="3"/>
    <circle cx="80" cy="137" r="6" fill="#f9e2af"/>
    <text x="60" y="142" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#11111b" text-anchor="middle">Budget</text>
    <text x="60" y="195" font-family="'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold" fill="#f9e2af" text-anchor="middle">b = $60 💵</text>

    <!-- Shopper Face -->
    <circle cx="60" cy="45" r="32" fill="#f5c2e7"/>
    <!-- Shocked / Calculating Eyes -->
    <circle cx="48" cy="40" r="7" fill="#fff"/>
    <circle cx="72" cy="40" r="7" fill="#fff"/>
    <circle cx="50" cy="40" r="3.5" fill="#11111b"/>
    <circle cx="74" cy="40" r="3.5" fill="#11111b"/>
    <!-- Open Mouth -->
    <ellipse cx="60" cy="58" rx="8" ry="10" fill="#11111b"/>
    <!-- Sweat drop -->
    <path class="sweat" d="M 86,30 Q 92,38 86,44 Q 80,38 86,30 Z" fill="#89dceb"/>
    <text x="60" y="-10" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#f5c2e7" text-anchor="middle">"Max out every dollar!"</text>
  </g>

  <!-- Store Shelves & Matrix -->
  <g transform="translate(200, 45)">
    <!-- Shelf Header -->
    <text x="280" y="15" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#89b4fa" text-anchor="middle">⌨️ Keyboards + 💾 USB Drives Combos</text>

    <!-- Grid Table -->
    <!-- Column Headers -->
    <text x="140" y="45" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1">USB $5</text>
    <text x="250" y="45" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1">USB $8</text>
    <text x="360" y="45" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1">USB $12</text>

    <!-- Row 1: Keyboard $40 -->
    <text x="10" y="85" font-family="monospace" font-size="13" font-weight="bold" fill="#cba6f7">KB $40</text>
    <rect x="110" y="65" width="85" height="35" rx="6" fill="#313244" stroke="#45475a"/>
    <text x="152" y="88" font-family="sans-serif" font-size="13" fill="#cdd6f4" text-anchor="middle">$45 👍</text>

    <rect x="220" y="65" width="85" height="35" rx="6" fill="#313244" stroke="#45475a"/>
    <text x="262" y="88" font-family="sans-serif" font-size="13" fill="#cdd6f4" text-anchor="middle">$48 👍</text>

    <rect x="330" y="65" width="85" height="35" rx="6" fill="#313244" stroke="#45475a"/>
    <text x="372" y="88" font-family="sans-serif" font-size="13" fill="#cdd6f4" text-anchor="middle">$52 👍</text>

    <!-- Row 2: Keyboard $50 -->
    <text x="10" y="140" font-family="monospace" font-size="13" font-weight="bold" fill="#cba6f7">KB $50</text>
    <rect x="110" y="120" width="85" height="35" rx="6" fill="#313244" stroke="#45475a"/>
    <text x="152" y="143" font-family="sans-serif" font-size="13" fill="#cdd6f4" text-anchor="middle">$55 👍</text>

    <!-- THE WINNER CELL (Glowing Gold) -->
    <rect x="220" y="120" width="85" height="35" rx="6" fill="#f9e2af" stroke="#fab387" stroke-width="2" filter="url(#glow)"/>
    <text x="262" y="143" font-family="sans-serif" font-size="14" font-weight="bold" fill="#11111b" text-anchor="middle">👑 $58 MAX</text>

    <rect x="330" y="120" width="85" height="35" rx="6" fill="#45475a" stroke="#f38ba8"/>
    <text x="372" y="143" font-family="sans-serif" font-size="13" fill="#f38ba8" text-anchor="middle">$62 ❌ Broke</text>

    <!-- Row 3: Keyboard $60 -->
    <text x="10" y="195" font-family="monospace" font-size="13" font-weight="bold" fill="#cba6f7">KB $60</text>
    <rect x="110" y="175" width="85" height="35" rx="6" fill="#45475a" stroke="#f38ba8"/>
    <text x="152" y="198" font-family="sans-serif" font-size="13" fill="#f38ba8" text-anchor="middle">$65 ❌</text>

    <rect x="220" y="175" width="85" height="35" rx="6" fill="#45475a" stroke="#f38ba8"/>
    <text x="262" y="198" font-family="sans-serif" font-size="13" fill="#f38ba8" text-anchor="middle">$68 ❌</text>

    <rect x="330" y="175" width="85" height="35" rx="6" fill="#45475a" stroke="#f38ba8"/>
    <text x="372" y="198" font-family="sans-serif" font-size="13" fill="#f38ba8" text-anchor="middle">$72 ❌</text>
  </g>

  <!-- Footer Banner -->
  <text x="400" y="300" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#f9e2af" text-anchor="middle">🎯 Optimal Purchase: $50 Keyboard + $8 USB Drive = $58 (Spent closest to $60 budget)</text>
</svg>

