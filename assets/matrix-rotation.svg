<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161e31" />
      <stop offset="100%" stop-color="#24304f" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="outerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner Ring Gradient -->
    <linearGradient id="innerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .mono { font-family: 'Courier New', monospace; font-size: 13px; fill: #facc15; font-weight: bold; }
    .cell-txt { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }

    /* Animated dash for ring flow */
    @keyframes flowCounter {
      to { stroke-dashoffset: -40; }
    }
    .flow-path { stroke-dasharray: 8 4; animation: flowCounter 2s linear infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="0" r="14" fill="#38bdf8" opacity="0.25" />
    <text x="16" y="5" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="900">&#x21BA;</text>
    <text x="40" y="5" class="title">Matrix Layer Rotation (Anti-Clockwise)</text>
    <text x="40" y="25" class="subtitle">Concentric Ring Decomposition &#x2022; Modular Rotation: r_effective = r % Perimeter_Length</text>
  </g>

  <!-- Left Card: 4x5 Concentric Rings Visualization -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="425" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">1. CONCENTRIC RINGS (min(m, n) / 2 Layers)</text>
    <text x="24" y="52" class="subtitle">4x4 Matrix has 2 distinct concentric cycles</text>

    <!-- 4x4 Grid Representation -->
    <g transform="translate(75, 75)">
      <!-- Outer Ring (Blue) -->
      <rect x="0" y="0" width="220" height="150" rx="8" fill="none" stroke="#38bdf8" stroke-width="3" class="flow-path" />

      <!-- Inner Ring (Purple) -->
      <rect x="55" y="38" width="110" height="74" rx="6" fill="none" stroke="#a855f7" stroke-width="2.5" class="flow-path" />

      <!-- Sample cells Outer (Row 0) -->
      <rect x="5" y="5" width="40" height="26" rx="4" fill="url(#outerRing)" />
      <text x="25" y="18" class="cell-txt">1</text>
      <rect x="60" y="5" width="40" height="26" rx="4" fill="url(#outerRing)" />
      <text x="80" y="18" class="cell-txt">2</text>
      <rect x="115" y="5" width="40" height="26" rx="4" fill="url(#outerRing)" />
      <text x="135" y="18" class="cell-txt">3</text>
      <rect x="175" y="5" width="40" height="26" rx="4" fill="url(#outerRing)" />
      <text x="195" y="18" class="cell-txt">4</text>

      <!-- Row 1 Inner -->
      <rect x="65" y="44" width="40" height="26" rx="4" fill="url(#innerRing)" />
      <text x="85" y="57" class="cell-txt">1</text>
      <rect x="115" y="44" width="40" height="26" rx="4" fill="url(#innerRing)" />
      <text x="135" y="57" class="cell-txt">2</text>

      <!-- Row 2 Inner -->
      <rect x="65" y="79" width="40" height="26" rx="4" fill="url(#innerRing)" />
      <text x="85" y="92" class="cell-txt">4</text>
      <rect x="115" y="79" width="40" height="26" rx="4" fill="url(#innerRing)" />
      <text x="135" y="92" class="cell-txt">3</text>

      <!-- Flow Arrows -->
      <text x="-15" y="80" fill="#38bdf8" font-size="16" font-weight="900">&#x2193;</text>
      <text x="110" y="170" fill="#38bdf8" font-size="16" font-weight="900">&#x2192;</text>
      <text x="230" y="80" fill="#38bdf8" font-size="16" font-weight="900">&#x2191;</text>
      <text x="110" y="-8" fill="#38bdf8" font-size="16" font-weight="900">&#x2190;</text>
    </g>

    <!-- Legend -->
    <g transform="translate(24, 255)">
      <rect width="377" height="48" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="20" class="label" fill="#38bdf8">&#x25AA; Outer Layer: Length = 12 cells</text>
      <text x="14" y="38" class="label" fill="#a855f7">&#x25AA; Inner Layer: Length = 4 cells</text>
    </g>
  </g>

  <!-- Right Card: 1D Flattening & Modulo Rotation -->
  <g transform="translate(485, 95)" filter="url(#shadow)">
    <rect width="395" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="32" class="card-title">2. 1D FLATTENING &amp; MODULO ARITHMETIC</text>
    <text x="24" y="52" class="subtitle">r &#x2264; 10&#x2079; &#x2192; Handled in O(1) shifts using r % Length</text>

    <!-- Step Breakdown -->
    <g transform="translate(24, 75)">
      <g transform="translate(0, 0)">
        <rect width="347" height="45" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="22" class="label" fill="#38bdf8">1. Extract Ring Coordinates:</text>
        <text x="14" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Traverse path: Top-Left &#x2193; Down &#x2192; Right &#x2191; Up &#x2190; Left</text>
      </g>

      <g transform="translate(0, 55)">
        <rect width="347" height="45" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="22" class="label" fill="#facc15">2. Compute Effective Shift:</text>
        <text x="14" y="38" class="mono">shift = r % L (O(1) direct offset)</text>
      </g>

      <g transform="translate(0, 110)">
        <rect width="347" height="45" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="22" class="label" fill="#34d399">3. Write Back to 2D Matrix:</text>
        <text x="14" y="38" class="mono">newIdx = (i + shift) % L</text>
      </g>
    </g>

    <!-- Time/Space Complexity Card -->
    <g transform="translate(24, 245)">
      <rect width="347" height="55" rx="8" fill="#0f172a" stroke="#38bdf8" />
      <text x="14" y="22" class="label" fill="#cbd5e1">Complexity for 300&#xD7;300 Matrix:</text>
      <text x="14" y="42" class="mono">Time: O(m &#xD7; n) &#x2022; Space: O(m &#xD7; n)</text>
    </g>
  </g>
</svg>
