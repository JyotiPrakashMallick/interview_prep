<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#2d2b55" />
    </linearGradient>

    <!-- Pivot and Successor Gills -->
    <linearGradient id="pivotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="succGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="revGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #a5b4fc; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .step-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .char { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .index-lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }

    /* Animated Swapping Path */
    @keyframes swapArcs {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .swapping { animation: swapArcs 2s infinite ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="920" height="460" rx="16" fill="url(#bgGrad)" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <circle cx="16" cy="0" r="14" fill="#a855f7" opacity="0.25" />
    <text x="16" y="5" text-anchor="middle" fill="#c084fc" font-size="16" font-weight="900">&#x2728;</text>
    <text x="40" y="5" class="title">Bigger is Greater: Next Lexicographical Permutation</text>
    <text x="40" y="25" class="subtitle">Narayana Pandita's Algorithm: 4-Step Suffix Inversion Mechanism</text>
  </g>

  <!-- Left Card: Step-by-Step Breakdown on "dkhc" -> "hcdk" -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="450" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="30" class="card-title">ALGORITHM BREAKDOWN: "dkhc" &#x2192; "hcdk"</text>

    <!-- Stage 1: Find Pivot -->
    <g transform="translate(24, 55)">
      <text x="0" y="0" class="label" fill="#facc15">Step 1 &amp; 2: Find Pivot i &amp; Smallest Larger Suffix j</text>
      <!-- d k h c -->
      <g transform="translate(10, 15)">
        <!-- d (index 0, Pivot!) -->
        <rect x="0" y="0" width="45" height="40" rx="6" fill="url(#pivotGrad)" stroke="#fde047" stroke-width="2" />
        <text x="22" y="21" class="char">d</text>
        <text x="22" y="52" class="index-lbl">i = 0</text>

        <!-- k (index 1) -->
        <rect x="55" y="0" width="45" height="40" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="77" y="21" class="char">k</text>
        <text x="77" y="52" class="index-lbl">1</text>

        <!-- h (index 2, Successor!) -->
        <rect x="110" y="0" width="45" height="40" rx="6" fill="url(#succGrad)" stroke="#7dd3fc" stroke-width="2" />
        <text x="132" y="21" class="char">h</text>
        <text x="132" y="52" class="index-lbl">j = 2</text>

        <!-- c (index 3) -->
        <rect x="165" y="0" width="45" height="40" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="187" y="21" class="char">c</text>
        <text x="187" y="52" class="index-lbl">3</text>

        <!-- Annotation pointer -->
        <path d="M 22, -8 L 22, -1 L 132, -1 L 132, -8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2" />
        <text x="230" y="25" class="step-desc">Pivot: 'd' &lt; 'k'</text>
        <text x="230" y="42" class="step-desc">Successor: 'h' &gt; 'd'</text>
      </g>
    </g>

    <!-- Stage 2: Swap -->
    <g transform="translate(24, 150)">
      <text x="0" y="0" class="label" fill="#38bdf8">Step 3: Swap Pivot ('d') with Successor ('h')</text>
      <!-- h k d c -->
      <g transform="translate(10, 15)">
        <rect x="0" y="0" width="45" height="40" rx="6" fill="url(#succGrad)" />
        <text x="22" y="21" class="char">h</text>

        <rect x="55" y="0" width="45" height="40" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="77" y="21" class="char">k</text>

        <rect x="110" y="0" width="45" height="40" rx="6" fill="url(#pivotGrad)" />
        <text x="132" y="21" class="char">d</text>

        <rect x="165" y="0" width="45" height="40" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="187" y="21" class="char">c</text>

        <text x="230" y="25" class="step-desc">Result: "hkdc"</text>
      </g>
    </g>

    <!-- Stage 3: Reverse suffix -->
    <g transform="translate(24, 235)">
      <text x="0" y="0" class="label" fill="#ec4899">Step 4: Reverse Suffix from i+1 to end ("kdc" &#x2192; "cdk")</text>
      <!-- h c d k -->
      <g transform="translate(10, 15)">
        <rect x="0" y="0" width="45" height="40" rx="6" fill="url(#succGrad)" />
        <text x="22" y="21" class="char">h</text>

        <rect x="55" y="0" width="45" height="40" rx="6" fill="url(#revGrad)" stroke="#f472b6" stroke-width="1.5" />
        <text x="77" y="21" class="char">c</text>

        <rect x="110" y="0" width="45" height="40" rx="6" fill="url(#revGrad)" stroke="#f472b6" stroke-width="1.5" />
        <text x="132" y="21" class="char">d</text>

        <rect x="165" y="0" width="45" height="40" rx="6" fill="url(#revGrad)" stroke="#f472b6" stroke-width="1.5" />
        <text x="187" y="21" class="char">k</text>

        <text x="230" y="25" class="step-desc">Minimal suffix order!</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Why It Works & Edge Cases -->
  <g transform="translate(510, 95)" filter="url(#shadow)">
    <rect width="370" height="325" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="24" y="30" class="card-title">PROPERTIES &amp; EDGE CASES</text>

    <!-- Why reversal works -->
    <g transform="translate(24, 55)">
      <rect width="322" height="78" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="14" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x1F9E0; Why Reverse Suffix?</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">The suffix after i was strictly descending.</text>
      <text x="14" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Reversing it flips it to strictly ascending,</text>
      <text x="14" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#4ade80">guaranteeing the smallest possible next word!</text>
    </g>

    <!-- Edge cases: no answer -->
    <g transform="translate(24, 148)">
      <rect width="322" height="78" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" />
      <text x="14" y="22" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">&#x274C; When to return "no answer"?</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">If no chars[i] &lt; chars[i+1] exists:</text>
      <text x="14" y="58" font-family="'Courier New', monospace" font-size="12" fill="#fca5a5">&#x2022; "fedcba", "bb", "a"</text>
      <text x="14" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">The word is already in maximum permutation.</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(24, 240)">
      <rect width="322" height="60" rx="8" fill="#0f172a" stroke="#a855f7" />
      <text x="14" y="24" class="label" fill="#c084fc">Final Result for "dkhc":</text>
      <text x="14" y="48" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#34d399">"hcdk"</text>
    </g>
  </g>
</svg>
