<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowTW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes s1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 24% { opacity: 0; } 25%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 49% { opacity: 0; } 50%, 74% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes s4 { 0%, 74% { opacity: 0; } 75%, 100% { opacity: 1; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .st1 { animation: s1 8s steps(1) infinite; }
    .st2 { animation: s2 8s steps(1) infinite; }
    .st3 { animation: s3 8s steps(1) infinite; }
    .st4 { animation: s4 8s steps(1) infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgTW)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🕔 "The Time in Words: Past the Hour or To the Next?"</text>

  <!-- Clock face -->
  <g transform="translate(200, 210)">
    <!-- "past" half (right, 1..30) and "to" half (left, 31..59) -->
    <path d="M 0 -120 A 120 120 0 0 1 0 120 Z" fill="#a6e3a1" opacity="0.12"/>
    <path d="M 0 120 A 120 120 0 0 1 0 -120 Z" fill="#fab387" opacity="0.12"/>
    <circle r="120" fill="none" stroke="#cba6f7" stroke-width="4"/>
    <text x="60" y="-40" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">past</text>
    <text x="60" y="-24" font-family="monospace" font-size="10" fill="#a6e3a1" text-anchor="middle">1..30</text>
    <text x="-60" y="-40" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#fab387" text-anchor="middle">to</text>
    <text x="-60" y="-24" font-family="monospace" font-size="10" fill="#fab387" text-anchor="middle">31..59</text>
    <g font-family="monospace" font-size="13" font-weight="bold" fill="#cdd6f4" text-anchor="middle">
      <text x="0" y="-100">12</text>
      <text x="104" y="5">3</text>
      <text x="0" y="110">6</text>
      <text x="-104" y="5">9</text>
    </g>
    <!-- hour hand (around 5) -->
    <line x1="0" y1="0" x2="30" y2="52" stroke="#89b4fa" stroke-width="6" stroke-linecap="round"/>

    <!-- minute hands, one per step -->
    <!-- 5:00 -> 0 deg -->
    <line class="st1" x1="0" y1="0" x2="0" y2="-95" stroke="#f9e2af" stroke-width="4" stroke-linecap="round"/>
    <!-- 5:15 -> 90 deg -->
    <line class="st2" x1="0" y1="0" x2="95" y2="0" stroke="#f9e2af" stroke-width="4" stroke-linecap="round"/>
    <!-- 5:28 -> 168 deg -->
    <line class="st3" x1="0" y1="0" x2="19.8" y2="92.9" stroke="#f9e2af" stroke-width="4" stroke-linecap="round"/>
    <!-- 5:47 -> 282 deg -->
    <line class="st4" x1="0" y1="0" x2="-92.9" y2="-19.8" stroke="#f9e2af" stroke-width="4" stroke-linecap="round"/>
    <circle r="7" fill="#f38ba8"/>
  </g>

  <!-- Speech panel -->
  <g transform="translate(360, 110)">
    <rect x="0" y="0" width="440" height="200" rx="14" fill="#181825" stroke="#cba6f7" stroke-width="2"/>

    <g class="st1" text-anchor="middle">
      <text x="220" y="55" font-family="monospace" font-size="30" font-weight="bold" fill="#89b4fa">5:00</text>
      <text x="220" y="105" font-family="'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold" fill="#a6e3a1" filter="url(#glowTW)">five o' clock</text>
      <text x="220" y="150" font-family="monospace" font-size="13" fill="#bac2de">m = 0 ➔ "o' clock"</text>
    </g>
    <g class="st2" text-anchor="middle">
      <text x="220" y="55" font-family="monospace" font-size="30" font-weight="bold" fill="#89b4fa">5:15</text>
      <text x="220" y="105" font-family="'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold" fill="#a6e3a1" filter="url(#glowTW)">quarter past five</text>
      <text x="220" y="150" font-family="monospace" font-size="13" fill="#bac2de">15 ➔ "quarter" (no "minutes")</text>
    </g>
    <g class="st3" text-anchor="middle">
      <text x="220" y="55" font-family="monospace" font-size="30" font-weight="bold" fill="#89b4fa">5:28</text>
      <text x="220" y="105" font-family="'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold" fill="#a6e3a1" filter="url(#glowTW)">twenty eight minutes past five</text>
      <text x="220" y="150" font-family="monospace" font-size="13" fill="#bac2de">m ≤ 30 ➔ "past" this hour</text>
    </g>
    <g class="st4" text-anchor="middle">
      <text x="220" y="55" font-family="monospace" font-size="30" font-weight="bold" fill="#89b4fa">5:47</text>
      <text x="220" y="105" font-family="'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold" fill="#fab387" filter="url(#glowTW)">thirteen minutes to six</text>
      <text x="220" y="150" font-family="monospace" font-size="13" fill="#bac2de">m &gt; 30 ➔ 60 − 47 = 13 "to" next hour</text>
    </g>
    <text x="220" y="185" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#6c7086" text-anchor="middle">1 ➔ "minute" │ 30 ➔ "half" │ 12 wraps to "one"</text>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ One word table for 1..29 │ m = 0 ➔ o' clock │ m ≤ 30 ➔ past │ m &gt; 30 ➔ to │ O(1) Time</text>
</svg>
