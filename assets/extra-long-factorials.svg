<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f9e2af" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="840" height="380" rx="16" fill="url(#bgFact)"/>

  <!-- Heading -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">💥 "Extra Long Factorials: When 64-Bit Integers Explode!"</text>

  <!-- Left: Standard Integer Overflow Alarm -->
  <g transform="translate(50, 65)">
    <rect width="320" height="175" rx="12" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="160" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">⚠️ 64-Bit Integer Capacity Crash</text>

    <!-- Animated Explosion / Overflow mascot -->
    <style>
      @keyframes shakeBomb {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-6deg); }
        75% { transform: rotate(6deg); }
      }
      .animBomb { animation: shakeBomb 0.8s infinite; transform-origin: 35px 35px; }
    </style>
    <g class="animBomb" transform="translate(15, 45)">
      <circle cx="35" cy="35" r="28" fill="#f38ba8"/>
      <!-- Bomb Fuse -->
      <path d="M 35,7 Q 45,-5 55,-2" fill="none" stroke="#fab387" stroke-width="3"/>
      <!-- Spark -->
      <polygon points="56,-4 62,-10 65,-2 58,2" fill="#f9e2af"/>
      <!-- Panic face -->
      <circle cx="27" cy="30" r="3" fill="#11111b"/>
      <circle cx="43" cy="30" r="3" fill="#11111b"/>
      <ellipse cx="35" cy="45" rx="7" ry="5" fill="#11111b"/>
    </g>

    <!-- Content breakdown -->
    <g transform="translate(95, 52)">
      <text x="0" y="16" font-family="monospace" font-size="11" fill="#cdd6f4">Max Safe: 2⁵³ - 1 ≈ 9 × 10¹⁵</text>
      <text x="0" y="36" font-family="monospace" font-size="11" fill="#a6adc8">20! = 2.43 × 10¹⁸ (Barely fits)</text>
      <rect x="-5" y="46" width="220" height="26" rx="4" fill="#181825"/>
      <text x="105" y="63" font-family="monospace" font-size="11" font-weight="bold" fill="#f38ba8" text-anchor="middle">25! = OVERFLOW! 🚨</text>
      <text x="0" y="90" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#eba0ac">Standard Number turns to Infinity / NaN!</text>
    </g>
    <text x="160" y="160" font-family="sans-serif" font-size="11" fill="#fab387" text-anchor="middle">Cannot use normal Number / long long!</text>
  </g>

  <!-- Middle: Multiplication Gear / BigInt Hero -->
  <g transform="translate(390, 95)">
    <style>
      @keyframes pulseHero {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .animHero { animation: pulseHero 1.8s infinite; transform-origin: 30px 45px; }
    </style>
    <g class="animHero">
      <rect width="60" height="90" rx="10" fill="#a6e3a1" stroke="#94e2d5" stroke-width="2"/>
      <text x="30" y="32" font-family="'Comic Sans MS', cursive, sans-serif" font-size="22" font-weight="bold" fill="#11111b" text-anchor="middle">Big</text>
      <text x="30" y="55" font-family="'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold" fill="#11111b" text-anchor="middle">Int</text>
      <text x="30" y="78" font-family="sans-serif" font-size="14" fill="#11111b" text-anchor="middle">🦸</text>
    </g>
    <path d="M 68,45 L 82,45" stroke="#f9e2af" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Right: 25! Result & 100! Superpower -->
  <g transform="translate(480, 65)">
    <rect width="310" height="175" rx="12" fill="#11111b" stroke="#a6e3a1" stroke-width="2" filter="url(#glowGold)"/>
    <text x="155" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">✨ BigInt / Manual Array Multiplication</text>

    <!-- Code pill -->
    <rect x="20" y="42" width="270" height="30" rx="6" fill="#313244"/>
    <text x="155" y="62" font-family="monospace" font-size="12" fill="#f9e2af" text-anchor="middle">result *= BigInt(i);</text>

    <!-- 25! exact answer display -->
    <text x="20" y="94" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">25! Exact Value (26 Digits):</text>
    <rect x="15" y="104" width="280" height="28" rx="4" fill="#181825"/>
    <text x="155" y="122" font-family="monospace" font-size="11" font-weight="bold" fill="#a6e3a1" text-anchor="middle">15511210043330985984000000</text>

    <!-- 100! stat -->
    <text x="155" y="155" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#fab387" text-anchor="middle">👑 100! contains 158 decimal digits!</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(50, 260)">
    <rect width="740" height="100" rx="10" fill="#181825" stroke="#45475a"/>
    <text x="370" y="26" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#cba6f7" text-anchor="middle">💡 Interview Dual Strategy: Built-in BigInt vs. Manual Digits Array</text>
    <text x="370" y="50" font-family="sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">1. Modern JS: let res = BigInt(1); for (let i = 2; i &lt;= n; i++) res *= BigInt(i);</text>
    <text x="370" y="70" font-family="sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">2. Manual Grade-School Multiplication: array digits[ ] where each node handles product % 10 and carry-overs.</text>
    <text x="370" y="90" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Time Complexity: O(n²) digit operations | Space: O(n log n) digits in result</text>
  </g>
</svg>
