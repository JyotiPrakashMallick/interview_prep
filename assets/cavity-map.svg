<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCavity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowX" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f38ba8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="840" height="380" rx="16" fill="url(#bgCavity)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🕳️ "Cavity Map: The Deepest Cell Crowned with an 'X'!"</text>

  <!-- Left: 3x3 Grid Inspection -->
  <g transform="translate(60, 65)">
    <rect width="320" height="230" rx="12" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
    <text x="160" y="26" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">🗺️ 3x3 Grid Scan: ['989', '191', '111']</text>

    <!-- 3x3 Cells (each 50x50) -->
    <g transform="translate(85, 42)">
      <!-- Row 0: Border -->
      <rect x="0" y="0" width="45" height="45" rx="6" fill="#313244"/>
      <text x="22.5" y="28" font-family="monospace" font-size="18" fill="#a6adc8" text-anchor="middle">9</text>
      <!-- North Neighbor -->
      <rect x="52" y="0" width="45" height="45" rx="6" fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
      <text x="74.5" y="28" font-family="monospace" font-size="18" font-weight="bold" fill="#fab387" text-anchor="middle">8</text>
      <text x="74.5" y="-6" font-family="'Comic Sans MS', cursive, sans-serif" font-size="10" fill="#fab387" text-anchor="middle">North</text>

      <rect x="104" y="0" width="45" height="45" rx="6" fill="#313244"/>
      <text x="126.5" y="28" font-family="monospace" font-size="18" fill="#a6adc8" text-anchor="middle">9</text>

      <!-- Row 1 -->
      <!-- West Neighbor -->
      <rect x="0" y="52" width="45" height="45" rx="6" fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
      <text x="22.5" y="80" font-family="monospace" font-size="18" font-weight="bold" fill="#fab387" text-anchor="middle">1</text>
      <text x="-16" y="80" font-family="'Comic Sans MS', cursive, sans-serif" font-size="10" fill="#fab387" text-anchor="middle">West</text>

      <!-- CENTER CELL: THE CAVITY (9 > 8, 1, 1, 1) -->
      <style>
        @keyframes pulseCavity {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.08); }
        }
        .animCavity { animation: pulseCavity 1.5s infinite; transform-origin: 74.5px 74.5px; }
      </style>
      <g class="animCavity">
        <rect x="52" y="52" width="45" height="45" rx="6" fill="#f38ba8" filter="url(#glowX)"/>
        <text x="74.5" y="81" font-family="monospace" font-size="22" font-weight="bold" fill="#11111b" text-anchor="middle">X</text>
      </g>

      <!-- East Neighbor -->
      <rect x="104" y="52" width="45" height="45" rx="6" fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
      <text x="126.5" y="80" font-family="monospace" font-size="18" font-weight="bold" fill="#fab387" text-anchor="middle">1</text>
      <text x="165" y="80" font-family="'Comic Sans MS', cursive, sans-serif" font-size="10" fill="#fab387" text-anchor="middle">East</text>

      <!-- Row 2 -->
      <rect x="0" y="104" width="45" height="45" rx="6" fill="#313244"/>
      <text x="22.5" y="132" font-family="monospace" font-size="18" fill="#a6adc8" text-anchor="middle">1</text>
      <!-- South Neighbor -->
      <rect x="52" y="104" width="45" height="45" rx="6" fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
      <text x="74.5" y="132" font-family="monospace" font-size="18" font-weight="bold" fill="#fab387" text-anchor="middle">1</text>
      <text x="74.5" y="163" font-family="'Comic Sans MS', cursive, sans-serif" font-size="10" fill="#fab387" text-anchor="middle">South</text>

      <rect x="104" y="104" width="45" height="45" rx="6" fill="#313244"/>
      <text x="126.5" y="132" font-family="monospace" font-size="18" fill="#a6adc8" text-anchor="middle">1</text>
    </g>

    <!-- Bottom border explanation -->
    <text x="160" y="218" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Border cells (grey) are NEVER cavities!</text>
  </g>

  <!-- Right: 4 Directional Rules Card -->
  <g transform="translate(420, 65)">
    <rect width="360" height="230" rx="12" fill="#11111b" stroke="#a6e3a1" stroke-width="2"/>
    <text x="180" y="26" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">🔍 Cavity Verification Checklist</text>

    <!-- Checklist rows -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="320" height="34" rx="6" fill="#313244"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" fill="#a6e3a1">✅ Not on border: 0 &lt; r &lt; n-1 &amp;&amp; 0 &lt; c &lt; n-1</text>

      <rect x="0" y="42" width="320" height="34" rx="6" fill="#313244"/>
      <text x="12" y="64" font-family="monospace" font-size="12" fill="#f9e2af">center &gt; North : 9 &gt; 8 ✅</text>

      <rect x="0" y="84" width="320" height="34" rx="6" fill="#313244"/>
      <text x="12" y="106" font-family="monospace" font-size="12" fill="#f9e2af">center &gt; South : 9 &gt; 1 ✅</text>

      <rect x="0" y="126" width="320" height="34" rx="6" fill="#313244"/>
      <text x="12" y="148" font-family="monospace" font-size="12" fill="#f9e2af">center &gt; West  : 9 &gt; 1 ✅</text>

      <rect x="0" y="168" width="320" height="34" rx="6" fill="#313244"/>
      <text x="12" y="190" font-family="monospace" font-size="12" fill="#f9e2af">center &gt; East  : 9 &gt; 1 ✅</text>
    </g>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(60, 310)">
    <rect width="720" height="52" rx="10" fill="#181825" stroke="#45475a"/>
    <text x="360" y="22" font-family="monospace" font-size="12" fill="#f9e2af" text-anchor="middle">Rule: Compare using original grid values so that replacing with 'X' doesn't affect neighbors!</text>
    <text x="360" y="40" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Time Complexity: O(n²) | Space Complexity: O(n²) for output matrix</text>
  </g>
</svg>
