<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <filter id="glowSL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a6e3a1" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    /* case [0,3]: segment highlight, car drives, bottleneck glows */
    @keyframes segA { 0%, 5% { opacity: 0; } 10%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes segB { 0%, 50% { opacity: 0; } 55%, 95% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes driveA { 0%, 10% { transform: translateX(0); } 40%, 100% { transform: translateX(240px); } }
    @keyframes driveB { 0%, 55% { transform: translateX(0); } 85%, 100% { transform: translateX(160px); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .sA { animation: segA 9s ease-in-out infinite; }
    .sB { animation: segB 9s ease-in-out infinite; }
    .carA { animation: driveA 9s ease-in-out infinite; }
    .carB { animation: driveB 9s ease-in-out infinite; }
    .mascot { animation: bounce 1.2s ease-in-out infinite; }
  </style>

  <rect width="840" height="400" rx="16" fill="url(#bgSL)"/>

  <!-- Title -->
  <text x="420" y="34" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🚗 "Service Lane: The Narrowest Point Decides!"</text>

  <!-- Mascot -->
  <g class="mascot" transform="translate(40, 60)">
    <circle cx="35" cy="35" r="30" fill="#cba6f7"/>
    <circle cx="25" cy="30" r="4" fill="#11111b"/>
    <circle cx="45" cy="30" r="4" fill="#11111b"/>
    <path d="M 22 44 Q 35 54 48 44" stroke="#11111b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="35" y="85" font-family="'Comic Sans MS', cursive, sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">"Will I fit?"</text>
  </g>

  <!-- Lane: 8 points, bar height = width * 30, bars grow up from baseline y=270 -->
  <text x="480" y="74" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#89b4fa" text-anchor="middle">width = [2, 3, 1, 2, 3, 2, 3, 3]</text>
  <line x1="150" y1="270" x2="810" y2="270" stroke="#45475a" stroke-width="2"/>
  <g font-family="monospace" font-weight="bold" text-anchor="middle">
    <rect x="160" y="210" width="70" height="60" rx="4" fill="#313244" stroke="#585b70"/><text x="195" y="245" font-size="16" fill="#cdd6f4">2</text><text x="195" y="290" font-size="11" fill="#6c7086">0</text>
    <rect x="240" y="180" width="70" height="90" rx="4" fill="#313244" stroke="#585b70"/><text x="275" y="230" font-size="16" fill="#cdd6f4">3</text><text x="275" y="290" font-size="11" fill="#6c7086">1</text>
    <rect x="320" y="240" width="70" height="30" rx="4" fill="#313244" stroke="#585b70"/><text x="355" y="260" font-size="16" fill="#cdd6f4">1</text><text x="355" y="290" font-size="11" fill="#6c7086">2</text>
    <rect x="400" y="210" width="70" height="60" rx="4" fill="#313244" stroke="#585b70"/><text x="435" y="245" font-size="16" fill="#cdd6f4">2</text><text x="435" y="290" font-size="11" fill="#6c7086">3</text>
    <rect x="480" y="180" width="70" height="90" rx="4" fill="#313244" stroke="#585b70"/><text x="515" y="230" font-size="16" fill="#cdd6f4">3</text><text x="515" y="290" font-size="11" fill="#6c7086">4</text>
    <rect x="560" y="210" width="70" height="60" rx="4" fill="#313244" stroke="#585b70"/><text x="595" y="245" font-size="16" fill="#cdd6f4">2</text><text x="595" y="290" font-size="11" fill="#6c7086">5</text>
    <rect x="640" y="180" width="70" height="90" rx="4" fill="#313244" stroke="#585b70"/><text x="675" y="230" font-size="16" fill="#cdd6f4">3</text><text x="675" y="290" font-size="11" fill="#6c7086">6</text>
    <rect x="720" y="180" width="70" height="90" rx="4" fill="#313244" stroke="#585b70"/><text x="755" y="230" font-size="16" fill="#cdd6f4">3</text><text x="755" y="290" font-size="11" fill="#6c7086">7</text>
  </g>

  <!-- Case A: [0, 3] -> min 1 at index 2 -->
  <g class="sA">
    <rect x="155" y="100" width="320" height="200" rx="10" fill="none" stroke="#fab387" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="320" y="240" width="70" height="30" rx="4" fill="none" stroke="#f38ba8" stroke-width="3"/>
    <text x="315" y="120" font-family="monospace" font-size="14" font-weight="bold" fill="#fab387" text-anchor="middle">case [0, 3]</text>
    <g class="carA"><text x="175" y="160" font-size="26">🚗</text></g>
    <text x="480" y="335" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowSL)">min(2, 3, 1, 2) = 1 ➔ only a width-1 vehicle fits</text>
  </g>

  <!-- Case B: [4, 6] -> min 2 at index 5 -->
  <g class="sB">
    <rect x="475" y="100" width="240" height="200" rx="10" fill="none" stroke="#89b4fa" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="560" y="210" width="70" height="60" rx="4" fill="none" stroke="#f38ba8" stroke-width="3"/>
    <text x="595" y="120" font-family="monospace" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">case [4, 6]</text>
    <g class="carB"><text x="495" y="160" font-size="26">🚙</text></g>
    <text x="480" y="335" font-family="'Comic Sans MS', cursive, sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1" text-anchor="middle" filter="url(#glowSL)">min(3, 2, 3) = 2 ➔ a width-2 vehicle fits</text>
  </g>

  <!-- Footer -->
  <text x="420" y="382" font-family="'Comic Sans MS', cursive, sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">⚡ Answer = min(width[i..j]) inclusive │ 0-based indices │ O(t · L) Time, L ≤ 1000</text>
</svg>
