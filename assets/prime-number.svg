<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPrime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bgPrime)"/>

  <!-- Title -->
  <text x="400" y="38" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" font-weight="bold" fill="#f9e2af" text-anchor="middle">🛡️ "Prime Fortress: Only Divisible by 1 &amp; Itself!"</text>

  <!-- Number 29 (Proud Prime Hero) -->
  <g transform="translate(100, 75)">
    <style>
      @keyframes shieldPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .primeHero { animation: shieldPulse 1.8s infinite; transform-origin: 60px 60px; }
    </style>
    <g class="primeHero">
      <!-- Shield Shape -->
      <path d="M 60,10 L 110,35 L 110,85 C 110,120 60,145 60,145 C 60,145 10,120 10,85 L 10,35 Z" fill="#a6e3a1" stroke="#94e2d5" stroke-width="3"/>
      <!-- Crown -->
      <polygon points="45,5 52, -5 60, 5 68, -5 75, 5" fill="#f9e2af"/>
      <text x="60" y="70" font-family="'Comic Sans MS', cursive, sans-serif" font-size="34" font-weight="bold" fill="#11111b" text-anchor="middle">29</text>
      <!-- Eyes & Smile on 29 -->
      <circle cx="50" cy="90" r="3" fill="#11111b"/>
      <circle cx="70" cy="90" r="3" fill="#11111b"/>
      <path d="M 52,100 Q 60,108 68,100" stroke="#11111b" stroke-width="2" fill="none"/>
    </g>
    <text x="60" y="175" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1" text-anchor="middle">Prime Number 👑</text>
    <text x="60" y="195" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Factors: [1, 29] only</text>
  </g>

  <!-- Versus / Testing Arrow -->
  <g transform="translate(250, 115)">
    <text x="50" y="25" font-family="'Comic Sans MS', cursive, sans-serif" font-size="18" font-weight="bold" fill="#f9e2af" text-anchor="middle">VS</text>
    <text x="50" y="55" font-family="sans-serif" font-size="11" fill="#eba0ac" text-anchor="middle">Test factors up to √N</text>
  </g>

  <!-- Number 77 (Busted Composite Number) -->
  <g transform="translate(370, 75)">
    <!-- Broken Circle Shape -->
    <circle cx="60" cy="70" r="55" fill="#f38ba8" stroke="#eba0ac" stroke-width="3"/>
    <text x="60" y="70" font-family="'Comic Sans MS', cursive, sans-serif" font-size="34" font-weight="bold" fill="#11111b" text-anchor="middle">77</text>
    <!-- Sad Eyes & Tear -->
    <circle cx="48" cy="88" r="3" fill="#11111b"/>
    <circle cx="72" cy="88" r="3" fill="#11111b"/>
    <path d="M 48,104 Q 60,96 72,104" stroke="#11111b" stroke-width="2" fill="none"/>
    <circle cx="44" cy="95" r="2" fill="#89dceb"/>

    <text x="60" y="175" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#f38ba8" text-anchor="middle">Composite Number 💥</text>
    <text x="60" y="195" font-family="monospace" font-size="12" fill="#f9e2af" text-anchor="middle">77 = 7 × 11 (Busted!)</text>
  </g>

  <!-- Pro-Tip Box (Square Root Optimization) -->
  <g transform="translate(530, 75)">
    <rect width="230" height="150" rx="10" fill="#313244" stroke="#fab387" stroke-width="2"/>
    <text x="115" y="28" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#fab387" text-anchor="middle">⚡ Why Stop at √N ?</text>
    <text x="115" y="55" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Any factor pair (a × b = N)</text>
    <text x="115" y="75" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">must have at least one factor ≤ √N.</text>
    <text x="115" y="105" font-family="monospace" font-size="12" fill="#a6e3a1" text-anchor="middle">For N = 100 ➔ test to 10</text>
    <text x="115" y="125" font-family="monospace" font-size="12" fill="#a6e3a1" text-anchor="middle">Saves 90 unnecessary tests!</text>
  </g>

  <!-- Footer -->
  <text x="400" y="295" font-family="'Comic Sans MS', cursive, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1" text-anchor="middle">🚀 Time Complexity: O(√N) instead of O(N) — Essential Interview Optimization!</text>
</svg>

